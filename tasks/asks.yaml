# The questions to the person the work is for, written by itos decision (itos help decision).
questions:
  - id: q-1
    item: "cli-contract"
    question: "For the default Go CLI, should each non-cumulative flag be accepted only once? Recommended: adopt the existing itos-template contract, reject --json --no-json and other repeated once-only flags with usage exit 2, and preserve explicitly cumulative flags as repeatable. Or: retain the current count CLI contract where the last negation wins. This changes ID-COUNT-06, so the selected behavior will be specified before implementation."
    answer: "Reject repeated non-cumulative flags with usage exit 2, matching the existing itos-template contract. Explicitly cumulative flags remain repeatable. Specify the replacement for ID-COUNT-06 before implementation; commit the failing steps first, and document the behavior change for generated CLI users."
    decision: 1
  - id: q-2
    item: "made-project-policy"
    question: "Automatic quality-policy inheritance is not supported by current itos init: it creates a generic starter, while an existing supplied config is diagnosed rather than getting fresh ledger/registry data. Recommended: pursue a focused upstream initialization capability that accepts reusable policy and creates project-local fresh work data, then keep template automatic setup dependent on it. Alternative: explicitly manual project adoption using a reviewed complete policy and newly authored initial data, without claiming automatic inheritance. Which should the default template target? In either case the generator stays unaware of itos, and policy is split between main, stack/go and go/cli."
    answer: "Pursue upstream itos support for initializing reusable policy with fresh project-local work data. File the focused consumer request after reproducing the current limitation and checking releases and existing issues. Automatic template policy setup depends on that capability; do not build a workaround or copy template history. Continue independent template guidance, enforcement, CI and release work. Keep the generator unaware of itos and preserve the main/stack/go/go/cli split."
    decision: 2
  - id: q-3
    question: "Question and decision numbers are per branch, and changes merge only downward, so a question asked on stack/go or go/cli takes a number main will reuse and the next merge down holds two different records under it. Recommended: ask, answer and record every question on main, even one specific to a stack or feature, so records merge down like other shared docs and numbers stay unique. Or: ask only template-wide questions on main and renumber branch-specific collisions by hand at each merge. Or: keep per-branch numbering and resolve collisions at each merge."
    answer: "Ask, answer and record every question on main, even one specific to a stack or feature; records merge down like other shared docs and numbers stay unique. q-2, first asked on stack/go, is asked again on main with the same text and answer, so the merge down meets an identical record."
    decision: 3
  - id: q-4
    question: "Task ids are per branch: each ledger numbers its own tasks, ledgers merge only downward, and main cannot see T-9 to T-11, so its next id would reuse T-9. Recommended: specify a task on the branch that implements it, with an id one above the highest in any branch's ledger on origin (main, stack/go, go/cli). Or: specify every task on main and merge it down before work starts. Or: give each branch its own id prefix."
    answer: "Specify a task on the branch that implements it, with an id one above the highest in any branch's ledger on origin: main, stack/go and go/cli. One coordinator per repository keeps the choice free of races."
    decision: 4
  - id: q-5
    item: "cli-exhaustive-errors"
    question: "cli-exhaustive-errors makes the linter refuse an error switch that leaves a sealed failure kind out; today readProblem's switch over port.ReadFailure is complete only by review. Recommended: gochecksumtype, bundled in the pinned golangci-lint and proven in itos-template, with port.ReadFailure annotated //sumtype:decl, default-signifies-exhaustive false and a compile-valid fixture proving an omitted kind is refused. Or: exhaustive, which checks enum constants rather than interface type switches and would need the failures remodelled. Or: not now, leaving the switch to review."
    answer: "gochecksumtype, as recommended: no new dependency or tool, the pinned golangci-lint already bundles it."
    decision: none
  - id: q-6
    item: "cli-releases"
    question: "cli-releases harvests the release helpers and adds the release job to ci.yml, but on a generated main the Go jobs are gated to stack/ and go/ branches and the ci job needs itos data a render drops, so the release cannot run there until made-project-ci lands. Recommended: split, harvesting the helpers and pin now and moving the caller and its generated-main proof to an idea depending on made-project-ci. Or: all in one now, the caller dormant on the template and unproven on a generated main until made-project-ci. Or: wait for made-project-ci."
    answer: "All in one now: harvest the helpers, the git-cliff pin and the release job in ci.yml together. The caller stays dormant on the template, whose go/cli branch is never main, and its proof on a generated main belongs to made-project-ci."
    decision: none
  - id: q-7
    item: "cli-releases"
    question: "release-notes groups a release's commits with git-cliff, a new checksum-pinned tool like golangci-lint and goreleaser. Recommended: pin git-cliff with itos-template's version and cliff.toml. Or: group the commits in release-notes itself from git log, diverging from the source."
    answer: "Pin git-cliff with itos-template's version, release checksums and cliff.toml; it runs only in the release workflow and the notes helper's tests."
    decision: none
  - id: q-8
    item: "template-check-ci"
    question: "No workflow runs itos-template check, so a manifest or branch change can break a render while every branch stays green. Recommended: a root-owned workflow, .github/workflows/template-check.yml, merged down unchanged and excluded from renders by template_only, running on every push to main, stack/** and go/** and weekly. Or: the same workflow weekly only, cheaper but up to a week late. Or: a job in go/cli's ci.yml, which a push to main or stack/go does not run until merged down."
    answer: "A root-owned .github/workflows/template-check.yml, merged down unchanged and listed in template_only, run on every push to main, stack/** and go/** and weekly."
    decision: none
  - id: q-9
    item: "template-check-ci"
    question: "How should CI get itos-template for the recurring check? Recommended: go install github.com/donvargax/itos-template/cmd/itos-template@v0.19.0, a fixed version verified by Go's checksum database and movable by Renovate. Or: the v0.19.0 release archive checked against SHA-256 sums in the workflow. Or: build itos-template's default branch from source, as T-7 does, never pinned."
    answer: "go install of itos-template at a fixed version, v0.19.0 today, verified by Go's checksum database."
    decision: none
  - id: q-10
    item: "template-check-rerun"
    question: "A push that adds a ledger entry on main or stack/go leaves that head's Template check red, since the render merges the branches and their ledgers conflict until the merge down reaches go/cli, and nothing runs it again. Recommended: when Template check passes on any branch's push, it re-runs the latest failed Template check of main's and stack/go's heads. Or: rely on the weekly run. Or: the coordinator re-runs it by hand after each merge down. Or: give each branch its own ledger file so the render's merge never conflicts there."
    answer: "Build the automatic rerun: a passing Template check re-runs the latest failed one on the parent branches' heads. Mark it deprecated in favour of per-branch ledger files: if each branch ever gets its own ledger file, and the render's merge no longer conflicts, the rerun is removed."
    decision: none
  - id: q-11
    item: "T-24"
    question: "Decision 4 numbers a new task one above the highest id on any branch, found by hand with git grep, because rc.1's task next-id reads only the local tree. itos 7.0.0-rc.4 mints every task and numbered item id from the counter refs/itos/ids on the remote, shared by all branches (itos decision 45), one past the higher of the counter and the highest id the branch holds, and task add, numbered work add and work promote refuse an id given. Recommended, as T-24 specifies: supersede decision 4 with ids minted by itos, and remove its command from the notes. Or: keep decision 4 beside the counter as a hand check."
    answer: "Supersede decision 4, as the person approved with T-24: itos mints every task and numbered item id from refs/itos/ids, shared by all branches, so a new id is unique without a hand rule, and the notes lose decision 4's git grep command. Questions are not counter-minted, so decision 3 stands."
    decision: 5
  - id: q-12
    item: "renovate-branches"
    question: "Renovate has never run on this repository, nor on itos or itos-template: no request, branch, dashboard or commit, so the app is likely not installed. renovate-branches can only be proven on a real request. Recommended: the person installs the Mend Renovate app and the item closes on a real request per branch. Or: a self-hosted renovatebot/github-action on a schedule with a stored token. Or: land the baseBranches config now and defer the proof until Renovate runs."
    answer: "Config only for now: land the baseBranches configuration, and defer proving it on a real request, as its own idea, until Renovate runs. The docs keep saying the automation is unverified."
    decision: none
  - id: q-13
    item: "made-project-policy"
    question: "itos 7.0.0-rc.5's init --policy copies a complete itos config once into a fresh project. Where does a made project's policy file live, and what happens to it after setup? Recommended: a complete itos-policy.yaml at each branch's top, which the setup step passes to itos init --policy and then deletes. Or: the same file kept after setup. Or: .itos/policy.yaml."
    answer: "A complete itos-policy.yaml at each branch's top; the setup step runs itos init --policy itos-policy.yaml and then deletes the file, so a made project has one config, its itos.yaml."
    decision: none
  - id: q-14
    item: "made-project-policy"
    question: "How is each branch's itos-policy.yaml kept in step with its own itos.yaml, which holds the same gates plus template-only steps? Recommended: a CI step on each branch fails when their commit rules or Go and CLI steps differ beyond a listed set of template-only steps. Or: a script generates the policy from itos.yaml. Or: by hand."
    answer: "A CI step on each branch compares itos-policy.yaml with the branch's itos.yaml and fails when they differ beyond a listed set of template-only steps."
    decision: none
  - id: q-15
    item: "made-project-policy"
    question: "Renovate's branch configs carry Task: T-2, which a made project's fresh ledger will not hold. Recommended: a made project's policy does not require Task on build and ci commits, the branch renovate.json5 files drop the trailer, and main's config adds the template's trailers per base branch. Or: setup creates a dependencies task that the made project's Renovate config names."
    answer: "A made project's policy requires no Task on build and ci commits, and the branch renovate.json5 files carry no trailer; main's config gives the template's own requests their Task trailer per base branch."
    decision: none
  - id: q-16
    item: "made-project-policy"
    question: "Renders ship the template's mutation records (.metrics/mutate/) and reviewed exceptions (itos-cc.yaml). Should a made project start with them? Recommended: keep them as its baseline, since its code starts as the template's, renamed, and its own proof judges only its changes after setup. Or: exclude them through template_only, so its mutation sample has nothing until a first full run."
    answer: "Keep them as the made project's baseline. Its code starts as the template's, renamed, so the records and reviewed exceptions describe it, and its own code proof judges only what it changes after setup. The rule against copying another project's cache by hand stands."
    decision: none
  - id: q-17
    item: "template-only-docs"
    question: "Renders ship PLAN.md and docs/ORCHESTRATING.md, which only make sense for the template, and README.md and AGENTS.md mix template text with project rules. Recommended: split files by audience, putting PLAN.md and docs/ORCHESTRATING.md in template_only, rewriting stack/go's and go/cli's README.md and AGENTS.md for the made project, and moving their template-facing parts to a template_only TEMPLATE.md that AGENTS.md points to only while it exists. Or: a setup step deletes the template-only files, leaving the mixed ones as they are."
    answer: "Split files by audience: PLAN.md and docs/ORCHESTRATING.md in template_only; the rendering branches' README.md and AGENTS.md written for the made project; their template-facing parts in a template_only TEMPLATE.md, pointed to only while it exists. main's README stays the template's front page."
    decision: none
  - id: q-18
    item: "template-only-docs"
    question: "Which decision records does a made project get? Decision 1 binds a made CLI; decisions 2 to 5 are about running the template. Recommended: ship them all, as records of why the code is as it is. Or: ship only decision 1, with an index listing only it."
    answer: "Ship only decision 1, with an index that lists only it."
    decision: none
  - id: q-19
    item: "render-decisions-index"
    question: "q-18 ships only decision 1 with an index listing only it, but itos writes docs/decisions/README.md from every record in the folder, so a render's index cannot list a subset without a second hand-kept index. Recommended: a template-only fix, adding decisions 2 to 5 and the index README.md to template_only, so a render ships decision 1 alone and the made project gets its index when it records its first decision. Or: ship a hand-kept one-line index for renders beside itos's."
    answer: "The template-only fix: decisions 2 to 5 and docs/decisions/README.md join template_only, so a render ships decision 1 alone; the made project's index appears with its first recorded decision. This revises q-18's index clause."
    decision: none
  - id: q-20
    item: "renovate-proof"
    question: "Renovate updates stack/go and go/cli separately (T-25). The same version on both merges cleanly, but different versions, from one request failing CI or landing after a newer release, conflict in go.mod and go.sum, so the merge down and Template check's go + cli render fail until a person resolves the merge. Recommended: keep per-branch updates and resolve a clash in a routine merge down. Or: go/cli takes the stack's modules only through the merge down, its config leaving them alone."
    answer: "Keep per-branch updates. A go.mod or go.sum clash between stack/go and go/cli is resolved in a routine merge down; if clashes keep happening, revisit letting go/cli take the stack's modules only by merge."
    decision: none
  - id: q-21
    item: "made-project-ci"
    question: "A made project's CI cannot pass on its main today: the ci job's itos steps fail with no itos.yaml (a render ships none until T-27's setup), and setup-go and the three platform jobs skip main because stack/go's and go/cli's ci.yml gate them on template branch names, which those files never need since template main runs its own ci.yml. Recommended order: pin itos 7.0.0 on every branch (its init --policy keeps an existing smoke set, fixing donvargax/itos#39), then lift and land T-27 so a made project gets its itos.yaml, then made-project-ci drops the branch-name conditions. Or: made-project-ci first, dropping the conditions so Go and platform jobs run while the ci job stays red until T-27."
    answer: "The recommended order: pin itos 7.0.0 on every branch, then lift and land T-27 so a made project gets its itos.yaml, then made-project-ci drops the branch-name conditions."
  - id: q-22
    item: "made-project-ci"
    question: "made-project-ci must be proved on a real made project's exact-head CI, which needs a GitHub repository rendered from the template. Recommended: one public repository, donvargax/go-template-itos-sample, made with itos-template new (go + cli) and set up as T-27 says, kept afterwards so the run addresses stay readable; public keeps Actions free and lets a later release proof attest. Or: a private repository. Or: a fresh repository per proof, deleted after the run is recorded."
    answer: "One public repository, donvargax/go-template-itos-sample, made with itos-template new (go + cli) and set up as T-27 says, kept afterwards. It is the third repository and should be the last: the end goal stays this repository being both the template and its own made project, tried again once itos-template update and the per-branch machinery exist (idea self-made-project)."
  - id: q-23
    item: "made-project-ci"
    question: "made-project-ci's note also owns proving a real binary release on a made main (since T-20). A release publishes tags and archives from the sample repository and is its own risk. Recommended: move the release proof to cli-releases, so made-project-ci closes when the Go jobs run green on a made main. Or: keep both in made-project-ci."
    answer: "Split: made-project-ci closes when the ci job and the three platform jobs pass on the sample repository's main; the real binary release proof moves to cli-releases, done right after it, revising q-6's placement."
  - id: q-24
    item: "cli-releases"
    question: "cli-releases must prove a real release on donvargax/go-template-itos-sample, but a release needs a feat or fix commit since the last tag, and q-22 keeps the sample a pure render plus its setup. Recommended: one small fix commit in the sample, made through its own itos rules, which cuts v0.1.0 and stays in its history as its only own commit, noted where a later itos-template update would meet it. Or: render a second, throwaway made project for the release proof and delete it afterwards. Or: wait and prove the release with the first template change that a kept-current sample takes as a fix."
    answer: "One small fix commit in the sample, made through its own itos rules, which cuts v0.1.0 and stays as its only own commit, noted where a later itos-template update would meet it."
  - id: q-25
    item: "T-33"
    question: "q-24's fix commit cannot be made honestly: the sample's own rules require every fix and feat to carry a Scenarios footer naming live scenarios it turns green, and a docs/go.md rewrite turns none green (a fix-only release would also be v0.0.1, not v0.1.0 as q-24 said). Recommended: make a real behaviour change on go/cli first, cli-once-only-flags (reject repeated non-cumulative flags), red scenarios first, then replay that same change in the sample as its fix commit with the same Scenarios footer, cutting v0.0.1, so the sample stays the template's render plus the template's own changes and a later update meets identical text; the docs/go.md rewrite goes in as a docs commit beside it. Or: a feat or fix invented only for the sample, with its own scenario. Or: let a prose-only fix skip Scenarios in the policy. Or: wait for itos-template update and prove the release with the first template change it brings."
    answer: "The recommended path: build cli-once-only-flags on go/cli first, red scenarios first, then replay that same change in the sample as its fix commit with the same Scenarios footer, and the docs/go.md rewrite as a docs commit beside it. T-33 waits on cli-once-only-flags."
  - id: q-26
    item: "cli-once-only-flags"
    question: "release-version, harvested from itos-template, makes any breaking change a major bump even below 1.0, so a breaking fix as a made project's first release cuts v1.0.0. SemVer says only that anything may change in 0.y.z; the common convention (Cargo, npm's caret, release-please's bump-minor-pre-major) puts breaking changes in the minor while the major is 0. Recommended: below 1.0 a breaking change bumps the minor and a feat or fix the patch, in go/cli's release-version with its tests, so a made project leaves 0.x only by choice; offer the same rule to itos-template, whose own v0 has had no breaking change yet. Or: below 1.0 a breaking change bumps the minor, a feat still the minor and a fix the patch. Or: keep the harvested rule, breaking means major always."
    answer: "Keep release-version's harvested rule unchanged for now; the person will review why it bumps the major below 1.0 across every project using it. Until v1, work around it: no commit is marked breaking (no ! in the header, no BREAKING CHANGE footer). cli-once-only-flags lands as a plain fix with Upgrading none, so the sample's first release is v0.0.1."
  - id: q-27
    item: "T-33"
    question: "q-25 rested on a mistake: cli-once-only-flags was already delivered on go/cli as T-14 (da0a56e), before the sample was rendered, so there is no template behaviour change to replay, and no other pending item changes behaviour. Recommended: defer T-33 until the template's next real feat or fix, replayed in the sample with its Scenarios footer, and push the docs/go.md rewrite to the sample now as a docs commit, which releases nothing. Or: specify a small new feat for the example CLI on go/cli now, which the sample then takes as its first release, v0.1.0. Or: a feat or fix made only in the sample."
