# The questions to the person the work is for, written by itos decision (itos help decision).
questions:
  - id: q-1
    item: "cli-contract"
    question: "For the default Go CLI, should each non-cumulative flag be accepted only once? Recommended: adopt the existing itos-template contract, reject --json --no-json and other repeated once-only flags with usage exit 2, and preserve explicitly cumulative flags as repeatable. Or: retain the current count CLI contract where the last negation wins. This changes ID-COUNT-06, so the selected behavior will be specified before implementation."
    answer: "Reject repeated non-cumulative flags with usage exit 2, matching the existing itos-template contract. Explicitly cumulative flags remain repeatable. Specify the replacement for ID-COUNT-06 before implementation; commit the failing steps first, and document the behavior change for generated CLI users."
    decision: 1
  - id: q-2
    item: "made-project-policy"
    question: "Automatic quality-policy inheritance is not supported by current itos init: it creates a generic starter, while an existing supplied config is diagnosed rather than getting fresh ledger/registry data. Recommended: pursue a focused upstream initialization capability that accepts reusable policy and creates project-local fresh work data, then keep template automatic setup dependent on it. Alternative: explicitly manual project adoption using a reviewed complete policy and newly authored initial data, without claiming automatic inheritance. Which should the default template target? In either case the generator stays unaware of itos, and policy is split between main, stack/go and go/cli."
    answer: "Pursue upstream itos support for initializing reusable policy with fresh project-local work data. File the focused consumer request after reproducing the current limitation and checking releases and existing issues. Automatic template policy setup depends on that capability; do not build a workaround or copy template history. Continue independent template guidance, enforcement, CI and release work. Keep the generator unaware of itos and preserve the main/stack/go/go/cli split."
    decision: 2
  - id: q-3
    question: "Question and decision numbers are per branch, and changes merge only downward, so a question asked on stack/go or go/cli takes a number main will reuse and the next merge down holds two different records under it. Recommended: ask, answer and record every question on main, even one specific to a stack or feature, so records merge down like other shared docs and numbers stay unique. Or: ask only template-wide questions on main and renumber branch-specific collisions by hand at each merge. Or: keep per-branch numbering and resolve collisions at each merge."
    answer: "Ask, answer and record every question on main, even one specific to a stack or feature; records merge down like other shared docs and numbers stay unique. q-2, first asked on stack/go, is asked again on main with the same text and answer, so the merge down meets an identical record."
    decision: 3
  - id: q-4
    question: "Task ids are per branch: each ledger numbers its own tasks, ledgers merge only downward, and main cannot see T-9 to T-11, so its next id would reuse T-9. Recommended: specify a task on the branch that implements it, with an id one above the highest in any branch's ledger on origin (main, stack/go, go/cli). Or: specify every task on main and merge it down before work starts. Or: give each branch its own id prefix."
    answer: "Specify a task on the branch that implements it, with an id one above the highest in any branch's ledger on origin: main, stack/go and go/cli. One coordinator per repository keeps the choice free of races."
    decision: 4
  - id: q-5
    item: "cli-exhaustive-errors"
    question: "cli-exhaustive-errors makes the linter refuse an error switch that leaves a sealed failure kind out; today readProblem's switch over port.ReadFailure is complete only by review. Recommended: gochecksumtype, bundled in the pinned golangci-lint and proven in itos-template, with port.ReadFailure annotated //sumtype:decl, default-signifies-exhaustive false and a compile-valid fixture proving an omitted kind is refused. Or: exhaustive, which checks enum constants rather than interface type switches and would need the failures remodelled. Or: not now, leaving the switch to review."
    answer: "gochecksumtype, as recommended: no new dependency or tool, the pinned golangci-lint already bundles it."
    decision: none
  - id: q-6
    item: "cli-releases"
    question: "cli-releases harvests the release helpers and adds the release job to ci.yml, but on a generated main the Go jobs are gated to stack/ and go/ branches and the ci job needs itos data a render drops, so the release cannot run there until made-project-ci lands. Recommended: split, harvesting the helpers and pin now and moving the caller and its generated-main proof to an idea depending on made-project-ci. Or: all in one now, the caller dormant on the template and unproven on a generated main until made-project-ci. Or: wait for made-project-ci."
