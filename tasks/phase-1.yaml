# The ledger's phase 1: the tasks that drive every commit but a feat, a fix or
# a docs, each named in its commit's Task footer (itos commit --task T-2).
# A task:
#
#   - id: T-2
#     type: chore # one of commits.types
#     title: What it is
#     why: Why it is worth doing. # optional
#     done_when: # the checks that prove it, which itos task T-2 runs
#       - run: a command that exits 0 once it is done
- id: T-1
  type: chore
  title: Bootstrap the language-neutral template root
  why: >
    Establish the shared root policy, documentation, Renovate setup and root-only CI
    before the Go stack or CLI exists. Checks deliberately omit itos-template.yaml,
    which is template metadata excluded from made projects.
  done_when:
    - run: itos config check
    - run: tools/bin/doc-caps
    - run: >-
        test -f AGENTS.md && test -f CLAUDE.md && test -f CONTRIBUTORS.md &&
        test -f PLAN.md && test -f README.md && test -f docs/ORCHESTRATING.md &&
        test -f docs/architecture.md && test -f docs/security.md &&
        test -f docs/upgrading.md && test -f LICENSE && test -f .gitattributes &&
        test -f .gitignore && test -f .github/workflows/ci.yml &&
        test -f .github/renovate.json5 && test -x tools/bin/doc-caps
- id: T-4
  type: build
  title: Keep the template's itos data out of every render, and drop first_commit's footer
  why: >
    Each branch already keeps its own config, ledger and registry, scoped to the work that happened
    on it: main holds T-1, stack/go adds T-2, go/cli adds T-3 and the count-cli slice, and no branch
    holds another's work. Nothing is duplicated that ought to be one thing, so no branch is added,
    nothing merges up into anything, and no CI plan moves: every branch keeps the gates, the plan,
    the proof and the task checks it has today. What a render would inherit is the problem, and the
    fix is two lines of the manifest. Add to it a template_only naming itos.yaml and tasks, the two
    paths a render has no use for, which IsTemplateOnly already excludes from every render beside
    the manifest itself. Drop the Task footer from first_commit: a render is committed before the
    made project has any ledger, so the footer names nothing, and in a made project T-1 means Adopt
    itos rather than anything this repository decides. The made project's own setup comes from the
    template's declared setup steps per ADR-0031, a later piece.
  done_when:
    - run: m=itos-template.yaml && grep -q '^template_only:' "$m" && grep -qE '^  - itos\.yaml$' "$m" && grep -qE '^  - tasks$' "$m" && ! grep -q 'Task:' "$m"
- id: T-5
  type: build
  title: The manifest declares what every render must pass, so check proves something
  why: >
    check runs and passes today and proves nothing: the manifest names no checks, so every
    combination renders and has nothing to run, and its only output is the warning that no check is
    marked as scanning the renders for credentials. Declare the checks beside what they check, per
    branch as docs/manifest.md says: the root's, stack/go's own, the cli feature's own, and a
    combination running the root's then the stack's then the features' in order. What each branch
    already runs in its CI is what its renders must pass, so a render is proved as strongly as the
    branch it came from. Checks run with no shell, so the gofmt pipeline is written as [sh, -c, …]
    and every other is a plain word list, each word's literals replaced by the answers as a file's
    contents are. No check is an itos one: after T-4 a render carries none of this repository's itos
    data, so itos config check and the like would have nothing to read, and the made project's own
    setup comes from the template's declared setup steps per ADR-0031. Pin gitleaks the way
    tools/bin/pinned pins the others, at a version and its release's own checksum, and mark it
    scans: [credentials] as the root's check, so every render is scanned and check stops warning.
    itos-template scans no render itself and knows no tool that does: the template names its own.
    The pin lands on the Go stack with the other tools itos.yaml's plan runs, never on the root,
    which has no toolchain; the manifest is one file on the root and merges down, so every render of
    a stack already carries the tool the root's check runs.
  done_when:
    - run: "m=itos-template.yaml && grep -q '^checks:' \"$m\" && grep -q 'scans: \\[credentials\\]' \"$m\" && grep -q 'gitleaks' \"$m\" && grep -qE '^  - name: go$' \"$m\" && grep -qE '^  - name: cli$' \"$m\""
    - run: m=itos-template.yaml && grep -q 'gofmt' "$m" && grep -q 'go, build' "$m" && grep -q 'go, vet' "$m" && grep -q 'go, mod, verify' "$m" && grep -q 'go, mod, tidy, -diff' "$m" && grep -q 'golangci-lint' "$m" && grep -q 'govulncheck' "$m" && grep -q 'go, test' "$m" && grep -q 'domain-coverage' "$m" && grep -q 'mutation, sample' "$m" && grep -q 'go, test, ./features' "$m"
    - run: test ! -f tools/bin/pinned || grep -q 'gitleaks' tools/bin/pinned
- id: T-7
  type: docs
  title: Prove the first template end to end and say it is ready
  why: >
    The umbrella first-template, and the closing claim no earlier item makes because it was not true
    yet: that a project made from this template is a working project, and that the template may be
    advertised as ready. PLAN.md's order of work says it is advertised as ready only after the
    template-check piece passes, so this is where that happens and nowhere else. Three things have
    to hold, and one run proves all of them. The public template renders every combination its
    manifest allows and each render passes the checks the manifest names, with the credential scan
    marked so no warning is left. A project made from the public template builds, vets and tests,
    runs its own command, carries none of this repository's itos data, and has a first commit that
    names no task. And this repository's own documents stop claiming the template is unfinished,
    because after this it is not: the README status, PLAN.md's order of work and the sentence in
    docs/security.md that said no render credential scan was installed. Do not re-render
    itos-container here and do not treat it as a deliverable; it was a working sample taken while
    the manifest was still incomplete. The check builds this repository's generator from its public
    source and proves the template against the public URL, so it proves what a person can actually
    get rather than a local copy.
- id: T-8
  type: docs
  title: Document the shared engineering practices every project inherits
  why: >
    Put language- and interface-independent practices on main, so every stack inherits them.
    The person explicitly wants this split: shared engineering policy on main, Go-specific policy
    and tooling on stack/go, and CLI-specific policy and tooling on go/cli. Harvest the general
    design and testing rules already used by donvargax/itos-template: vertical slices with thin
    entry points, domain-owned behavior through ports, no copying domain types into options or
    DTOs, adapters translating outside models only where needed, outcome-based domain tests with
    fakes rather than mocks, public-entry-point acceptance tests, person-owned library choices,
    OS differences as values, and honest claims about checks. Keep AGENTS.md short and point it
    to docs/engineering.md. The guide distinguishes policy from what a branch currently enforces;
    it adds no Go tool, CLI contract, scenario, workflow, or new quality gate to the root.
    Go enforcement, CLI guidance, generated-project setup and releases are separate items. Shared
    docs merge downward without rewriting history; child branches retain their own gates and work
    history. Do not copy the generator's domain, task IDs, mutation cache or historical decisions.
  done_when:
    - run: test -f docs/engineering.md && grep -q 'docs/engineering.md' AGENTS.md
    - run: grep -q '## Design' docs/engineering.md && grep -q '## Tests' docs/engineering.md && grep -q '## Dependencies' docs/engineering.md && grep -q '## What is enforced' docs/engineering.md
- id: T-13
  type: build
  title: Every Go render runs the import-boundary self-test
  why: >
    T-9 added tools/bin/architecture-check to stack/go's CI and T-11 to go/cli's, but the manifest's
    go and cli check lists still copy the plans from before them, so itos-template check proves a
    render's lint rules without proving those rules still catch what they should. Add
    [tools/bin/architecture-check] to both lists, right after golangci-lint where the branches'
    plans run it; it runs go test over fixtures and the pinned linter, no shell and no itos. The
    smoke check stays out: it is an itos command, and a render carries no itos data (T-5). The
    manifest is one root file, so the change lands on main and merges down into stack/go and then
    go/cli with normal merge commits, each keeping the receiving branch's registry and config,
    merging ledgers additively in id order. Prove it with itos-template check on both combinations
    at the merged heads, and record what it printed. A render whose fixtures fail after the literals
    are replaced is a finding to report, not a check to drop.
  done_when:
    - run: test "$(grep -c "tools/bin/architecture-check" itos-template.yaml)" -ge 2
- id: T-15
  type: docs
  title: Write the shared configuration-format guide
  why: >
    The person asked that a made CLI carry docs/CONFIG.md beside docs/CLI.md. Its rules hold for
    any interface, so the guide lives on main and merges down; the CLI feature adds only flags,
    environment variables and precedence in its own docs/CLI.md (cli-contract). Harvest the general
    rules of itos-template's docs/CONFIG.md, keeping its sources and provenance: defaults written
    down and printable, JSON data written as YAML, refusing what JSON cannot say (tags, anchors,
    several documents, duplicate keys), unknown keys refused, every problem named by its key path,
    a version on every file, snake-case keys, named lists as lists of objects, whole values, no
    secrets, documented keys and a schema. Leave out the generator's manifest and record, its
    decision and task numbers. The template has no configuration file, loader, schema or
    defaults printer, so the guide says a project applies the rules when it adds its first file
    and claims none of them is implemented. Formats owned by other tools (go.mod, linters, CI,
    itos.yaml) keep their own rules.
  done_when:
    - run: test -f docs/CONFIG.md && grep -q docs/CONFIG.md AGENTS.md
    - run: '! grep -qiE "decision [0-9]|manifest|T-[0-9]|\.itos-template" docs/CONFIG.md'
- id: T-21
  type: ci
  title: CI re-proves every render on each template push and weekly
  why: >
    No workflow runs itos-template check, so a change to the manifest or to a branch a render
    carries can break a render while every branch's own CI stays green; T-13 had to run it by
    hand. Add .github/workflows/template-check.yml on main (q-8): on every push to main, stack/**
    and go/**, and on a weekly schedule, with contents read only and runs of one ref cancelling
    older ones. The check renders origin's branch heads, so any branch's push re-proves both
    combinations. Install itos-template with go install at v0.19.0 (q-9), verified by Go's
    checksum database; Go comes from actions/setup-go, pinned by digest as the other workflows
    pin it, at the toolchain go/cli's go.mod names, read from that branch so it moves with the
    code. Run check over the repository with fixed sample answers, as T-7 does, and fail on a
    non-zero exit, any warning, or anything but every combination passing. List the workflow in
    the manifest's template_only so a made project never gets it. The file is root-owned, like
    the manifest: merge main into stack/go and then go/cli with normal merge commits, each keeping
    the receiving branch's registry and config, so every branch carries the same file. Main's
    ci.yml and the branches' own ci.yml stay as they are. Prove it with the workflow's own green
    run on each branch's head.
  done_when:
    - run: test -f .github/workflows/template-check.yml && grep -q "itos-template@v0.19.0" .github/workflows/template-check.yml && grep -q "schedule" .github/workflows/template-check.yml
    - run: grep -qE "^  - \.github/workflows/template-check\.yml$" itos-template.yaml
- id: T-23
  type: ci
  title: A passing Template check clears the parents' stale red runs
  why: >
    The render merges the branches, and a parent's new ledger entry conflicts with its children's
    until the merge down reaches go/cli, so that parent head's Template check run stays red and
    nothing runs it again (T-21, run 38021113542). The person chose an automatic rerun (q-10):
    when Template check passes on a push, a job re-runs the latest failed Template check of
    main's and stack/go's heads, other than its own run, using gh with the workflow's token. Only
    that job gets actions write; the check job stays contents read. A run that is not the head's
    latest, or a head whose latest passed, is left alone, and it never loops: a rerun is not a
    push and starts no rerun of its own. The rerun is deprecated in favour of per-branch-ledgers:
    the workflow says so beside the job, and that idea removes it once no render merge
    conflicts. The workflow is root-owned, so merge main into stack/go and then go/cli as T-21
    did. Prove it by a parent's red run turning green through the job, not by hand.
  done_when:
    - run: grep -q "actions. write" .github/workflows/template-check.yml && grep -q "per-branch-ledgers" .github/workflows/template-check.yml && grep -q "gh run rerun" .github/workflows/template-check.yml
- id: T-24
  type: build
  title: Move every branch to itos 7.0.0-rc.4 and retire decision 4
  why: >
    itos 7.0.0-rc.4 mints every item and scenario id through the counter refs/itos/ids on the
    remote, shared by all branches (itos decision 45, slice-102), which ends the cross-branch id
    clash decision 4 works around by hand. Every branch pins 7.0.0-rc.1. The person approved
    moving to rc.4, a pre-release as rc.1 is. On each of main, stack/go and go/cli, move the pin
    with itos pin and the workflow action with it, as docs/upgrading.md and the release's
    Upgrading section say, and apply every Upgrading step since rc.1 that the branch's config
    meets: rc.3 moves the code proof from work done into itos ci run, and rc.2 has work done drop
    a closed task's checks. Regenerate the agent rules with itos init --agent-rules, and correct
    the prose that describes the old flow (AGENTS.md, docs/ORCHESTRATING.md, docs/go.md,
    docs/upgrading.md) on each branch where it says so. A mint takes one past the higher of the
    counter and the highest id the branch holds; every branch holds T-24, so the first mint is
    T-25 or above. Do not mint an id to test it: record refs/itos/ids' absence before, and the
    coordinator checks the counter on its next real mint. Supersede decision 4 with a record
    saying ids are minted by itos, and remove its command from the notes. Questions are not
    counter-minted, so decision 3 stands. Branches move independently, since itos.yaml and
    ci.yml are each branch's own; merge main down afterwards for the shared docs, as earlier
    items did. A gate that rc.4 refuses on existing work is a finding to report, not a check to
    weaken.
- id: T-25
  type: ci
  title: Renovate updates every branch that holds code
  why: >
    Renovate reads its config from the default branch, main, which enables only github-actions and
    renovate-config, so the Go modules on stack/go and go/cli get no updates, and the branches' own
    configs, which enable gomod, are never read. main's file names baseBranchPatterns (main,
    stack/go, go/cli; Renovate renamed baseBranches, and strict validation refuses the old key)
    with useBaseBranchConfig merge, so each base branch's request is shaped by that branch's own
    renovate.json5 and judged by its own CI. Those two keys live in main's file only: a render
    ships the bottom branch's file to a made project, which has only main, and Renovate reads them
    from the default branch alone. Group one dependency's requests with groupName {{depName}} so
    they move together; skew between branches is acceptable. commitBody names the base branch, not
    main, in every file. Trailers follow q-15: commitTrailers is mergeable, so the branch files
    carry none, and main's file gives Task T-1 to main's requests and Task T-2 to stack/go's and
    go/cli's through package rules matching each base branch; a made project's file then has no
    trailer. Keep the owner presets, ignoreDeps for itos, the pinned action digests, the cooldown
    and automerge on green. Each file passes renovate-config-validator --strict. Renovate was
    installed while this was specified, but no request has landed, so docs/upgrading.md says so
    until renovate-proof. Change main's file, then stack/go's and go/cli's, merging main down as
    earlier items did.
- id: T-26
  type: build
  title: Move every branch to itos 7.0.0-rc.5
  why: >
    itos 7.0.0-rc.5 adds itos init --policy (slice-108, closing donvargax/itos#33), which
    made-project-policy needs: a made project's setup step runs it over the branch's
    itos-policy.yaml (q-13). Every branch pins 7.0.0-rc.4, and the release adds no breaking change
    past what T-24 applied; its Upgrading section is read anyway and any step the branches' configs
    meet is applied. On each of main, stack/go and go/cli, move the pin with itos pin 7.0.0-rc.5 and
    the itos workflow action with it, go/cli's release.yml included, pinned by the release's commit,
    and regenerate the agent rules. Branches move independently; merge main down afterwards for the
    ledger, as earlier items did, keeping each branch's itos.yaml, ci.yml and registry. A gate rc.5
    refuses on existing work is a finding, not a check to weaken.
- id: T-27
  type: build
  title: A made project adopts the template's quality policy at setup
  why: >
    A made project gets this template's gates in its files but none of its itos data: renders drop
    itos.yaml and tasks, so it has no commit rules, CI plan or code proof until it adopts a policy.
    itos 7.0.0's init --policy (donvargax/itos#33, slice-108) makes a fresh project from a
    complete itos config: it copies the commit rules, CI plan and proof config, resets commits.since
    to the project's HEAD and drops footers' since, and starts an empty registry and a ledger
    holding only its adoption task T-1, importing none of the template's tasks, questions, decisions
    or proof results. The generator stays unaware of itos (decision 2): the manifest moves to
    version 5 and lists setup steps, which itos-template new prints for the person to run and never
    runs itself. Settled by the person: each rendering branch keeps a complete itos-policy.yaml at
    its top, and the setup steps run itos init --policy itos-policy.yaml and then delete the file,
    so a made project has one config, its itos.yaml (q-13). A CI step on each such branch fails when
    itos-policy.yaml differs from the branch's own itos.yaml beyond a listed set of template-only
    differences (q-14). A made project's policy requires no Task footer on build and ci commits, so
    Renovate's requests, whose branch configs carry no trailer since T-25, pass its rules (q-15).
    Only stack/go and go/cli carry itos-policy.yaml: a render ships the bottom branch's file, and
    main never renders alone, so a file on main would only conflict on every merge down. Each is the
    branch's itos.yaml less what belongs to the template alone: its commit rules (types, scopes,
    footers with Task not required for build and ci, no since), its Go and CLI CI steps and
    proof.code, with the template-only steps removed (the check of the template's own document list
    and anything reading the template's ledger), and the ledger and registry paths a fresh project
    uses. The listed differences in the drift check are exactly those, each with its reason in a
    comment. The check runs in each branch's itos.yaml plan, with no new tool: plain sh and the
    tools the branch already pins. The manifest's setup steps go on the go stack, so both
    combinations print them once, in order: itos init --policy itos-policy.yaml, then removing itos-
    policy.yaml. The init offers (plugin, git shim, agent rules) stay the person's to answer when
    they run it. itos-policy.yaml is not in template_only. Prove it on both combinations: render
    with itos-template new at the version the Template check pins, run the printed steps with itos
    7.0.0 in the made project, then itos config check, itos task, itos ci plan over the made
    project's first commits, and the made project's own go build and tests. The made project's CI on
    an ordinary main is made-project-ci's, not this item's: its Go jobs still skip main, so do not
    claim it runs. Template check stays green on every head. Tried on a go + cli render before this
    was specified (itos-template 0.19.0, itos 7.0.0-rc.5): init --policy refused, because the render
    ships features/smoke.yaml and init never writes over itos data. The person keeps the smoke set
    in renders: it is part of the template's code, its selections and reasons reviewed like code,
    and a derived set loses every reason. So itos had to adopt an existing valid smoke set,
    reported as donvargax/itos#39 and fixed in 7.0.0 (6c72b7f keeps a smoke set the project has
    when the smoke check passes), which every branch pins since T-30. No setup step moves the file
    aside; if 7.0.0 still refuses it, stop and report rather than work around it. With the file
    removed, init otherwise passed: itos.yaml, a ledger holding T-1, an
    empty registry and a smoke set over the 3 feature files, with itos config check and the smoke
    check green. go/cli's tests use the built-in gherkin adapter, so slice-110's command-adapter
    case does not apply. The render also ships .metrics/mutate/ and itos-cc.yaml's reviewed
    exceptions, kept as the made project's baseline (q-16): its code starts as the template's,
    renamed, and its own proof judges only its changes after setup. Init's offers and its printed
    adoption commit stay the person's; the setup steps end after the policy file is removed.
- id: T-28
  type: docs
  title: Keep the template's own records and notes out of made projects
  why: >
    A render drops only itos.yaml, tasks and the template-check workflow, so a made project ships
    PLAN.md (the template's plan and branch layout), docs/ORCHESTRATING.md (the coordination notes
    for three branches), a README.md that calls it a template, an AGENTS.md mixing template rules
    with project rules, and decisions 2 to 5, which govern running the template. The person chose
    to split by audience (q-17): PLAN.md and docs/ORCHESTRATING.md join template_only; on stack/go
    and go/cli, README.md and AGENTS.md are written for the made project, and their template-facing
    parts (provenance and harvest rules, the branch layout, merging down, template boundaries, the
    reading order that starts at PLAN.md) move to TEMPLATE.md, also in template_only. AGENTS.md
    tells a reader to read TEMPLATE.md first only while that file exists, so the sentence is true
    in both places. main's README.md stays the template's front page, since main never renders
    alone. Provenance that a project must keep (CONTRIBUTORS.md, notices, harvest comments in code
    and guides) stays. A made project gets only decision 1, which binds its CLI, with a decisions
    index that lists only it (q-18): decisions 2 to 5 join template_only, and the index a render
    ships must name exactly the records it ships, without a second hand-kept list that can drift
    from itos's own. If itos cannot keep that true, stop and report before improvising. The
    branches' file-list check in itos.yaml keeps holding the template's own files; T-27's policy
    leaves it out. Prove it by rendering both combinations and reading what ships, and by
    Template check staying green.
- id: T-29
  type: build
  title: A render ships decision 1 alone
  why: >
    T-28 left decisions 2 to 5 in renders: itos writes docs/decisions/README.md from every record in
    the folder, so excluding records alone would ship an index linking files the render lacks. The
    person chose a template-only fix (q-19, revising q-18's index clause): decisions 2 to 5 and
    docs/decisions/README.md join the manifest's template_only, with a comment saying why, so a
    render ships decision 1, the one record that binds a made CLI, and the made project's index
    appears when it records its first decision. A decision the template records later that binds
    made projects stays out of template_only; one about running the template joins it, and
    TEMPLATE.md says so. Prove it by rendering both combinations and listing docs/decisions, and in
    a scratch made project adopting a policy and recording one decision, that the index itos
    writes names decision 1 beside it. Template check stays green.
- id: T-30
  type: build
  title: Move every branch to itos 7.0.0
  why: >
    itos 7.0.0 is the final release after rc.5, which every branch pins since T-26. Its init
    --policy keeps a smoke set the project already has when the smoke check passes (6c72b7f, closing
    donvargax/itos#39), which T-27's go + cli setup was deferred on: a render ships
    features/smoke.yaml and rc.5 refused to write over it. The person set the order in q-21: this
    pin, then T-27, then made-project-ci. Read the notes of rc.6, rc.7 and 7.0.0 (their Upgrading
    sections) and apply any step the branches' configs meet. On each of main, stack/go and go/cli,
    move the pin with itos pin 7.0.0 and the itos workflow action with it, go/cli's release.yml
    included, pinned by the release's commit, and regenerate the agent rules. Branches move
    independently; merge main down afterwards for the ledger, as earlier items did, keeping each
    branch's itos.yaml, ci.yml and registry. A gate 7.0.0 refuses on existing work is a finding, not
    a check to weaken. Push each branch's commits together and see its CI and Template check green.
- id: T-31
  type: ci
  title: A made project's CI runs its Go checks on its own main
  why: >
    A project made from the template and set up as T-27 says has its itos.yaml, but its CI still
    cannot prove its code on its own main. stack/go's and go/cli's ci.yml gate the ci job's setup-go
    step and the whole platform job on template branch names (stack/, go/, renovate/), so on a made
    main Go is never set up for the itos plan's Go steps and the Linux, macOS and Windows tests are
    skipped. Those conditions do nothing in the template: its main runs main's own root-only
    ci.yml, and these files only ever run on stack/go, go/cli and branches based on them. Remove
    the conditions from the setup-go step and the platform job on both branches, and keep the
    release job's own condition (a push to main) as it is. The comments that say a made main waits
    for made-project-ci change with the code they describe: ci.yml's and release.yml's in the ci
    commit, and TEMPLATE.md, docs/CLI.md, docs/upgrading.md and docs/ORCHESTRATING.md in a docs
    commit, saying what now runs and that a real release is still unproven (cli-releases). The
    workflow change lands on stack/go first and merges down into go/cli, each keeping its own
    itos.yaml and registry; main's ci.yml does not change. Prove it on a real made project's
    exact-head CI (q-22): render go + cli with itos-template v0.19.0 new from the public URL,
    answers name=go-template-itos-sample, owner=donvargax and
    module=github.com/donvargax/go-template-itos-sample, into the empty public repository
    donvargax/go-template-itos-sample; run the setup steps new prints with itos 7.0.0, answering
    init's offers no, make init's adoption commit, and push its main. That run's ci job and all
    three platform jobs must pass. The release job will run on that push: before pushing, run
    tools/bin/release-version in the made project to see whether it would release, since its first
    commits are chore commits; publishing a real release is cli-releases's proof (q-23), so if it
    would release, stop and report instead of pushing. The sample repository is kept afterwards, a
