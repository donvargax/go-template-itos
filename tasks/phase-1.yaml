# The ledger's phase 1: the tasks that drive every commit but a feat, a fix or
# a docs, each named in its commit's Task footer (itos commit --task T-2).
# A task:
#
#   - id: T-2
#     type: chore # one of commits.types
#     title: What it is
#     why: Why it is worth doing. # optional
#     done_when: # the checks that prove it, which itos task T-2 runs
#       - run: a command that exits 0 once it is done
- id: T-1
  type: chore
  title: Bootstrap the language-neutral template root
  why: >
    Establish the shared root policy, documentation, Renovate setup and root-only CI
    before the Go stack or CLI exists. Checks deliberately omit itos-template.yaml,
    which is template metadata excluded from made projects.
  done_when:
    - run: itos config check
    - run: tools/bin/doc-caps
    - run: >-
        test -f AGENTS.md && test -f CLAUDE.md && test -f CONTRIBUTORS.md &&
        test -f PLAN.md && test -f README.md && test -f docs/ORCHESTRATING.md &&
        test -f docs/architecture.md && test -f docs/security.md &&
        test -f docs/upgrading.md && test -f LICENSE && test -f .gitattributes &&
        test -f .gitignore && test -f .github/workflows/ci.yml &&
        test -f .github/renovate.json5 && test -x tools/bin/doc-caps
- id: T-2
  type: build
  title: Build the Go foundation and its proof gates
  why: >
    Add a working Go module with a private counting domain, Files port, read-only
    disk adapter, in-memory fake, examples and rapid property. Count logical lines:
    empty input is zero, LF separates lines, CRLF is one separator, and a nonempty
    unterminated final line counts. Words are non-whitespace runs under Go's
    standard-library Unicode tokenization, punctuation stays in words, and
    invalid UTF-8 is non-whitespace. Do not use Scanner's default limit. Missing
    and unreadable files are typed port failures, never raw OS models in domain
    behavior. The additive property joins newline-terminated pieces; arbitrary
    concatenation is not promised additive. Use no OS permission assumptions or
    runtime.GOOS logic. Keep only actual dependencies/tools, retain Rapid, and
    omit the future CLI and scenario runner. Add branch-specific Go CI and 80%
    domain coverage; prove changed code with fresh fail-uncovered mutation data.
  done_when:
    - run: go mod verify
    - run: go mod tidy -diff
    - run: go build ./...
    - run: go vet ./...
    - run: go test ./...
    - run: tools/bin/domain-coverage
- id: T-3
  type: build
  title: Build the public count CLI, its scenario runner and its release machinery
  why: >
    Third piece of the template, after the root and the Go foundation. Branch go/cli from
    the verified stack/go head without rewriting history; keep the foundation and its
    proof and coverage gates whole. Add a thin application handler and a kong UI whose
    command carries domain data and calls the counting domain through its Files port: no
    options struct copying a domain type, no counting in the UI, and no ordinary count
    refusal, so exit 1 is unused. The sealed error-kind-to-exit switch lives in the UI,
    exhaustive and never a default, so a kind no case classifies is the 70 of an
    unclassified bug and never a child process's status passed through. The command is
    count <file>, with - reading standard input and no implicit default action. Human
    success prints the counts on stdout and the use-json hint on stderr, never the input
    contents; --json prints one object with schema 1, ok, file (the argument, - for
    standard input), lines and words, and every failure prints its own object with
    problems carrying rule, message and fix. Missing input is COUNT_INPUT_MISSING and
    other unreadable input, a directory included, COUNT_INPUT_UNREADABLE, both exit 3;
    a usage failure exits 2. No arguments and --help print help on stdout with exit 0,
    while count without its file is a usage failure. --help and --version are actions,
    --json a negatable switch with GO_TEMPLATE_ITOS_JSON, the project's name in upper
    case. Install the runnable scenario kind, its footer and its CI selection together,
    never one without the others, and add a representative smoke scenario with each live
    feature file. The public behaviour lives in features/, tagged @count-cli, with the
    steps the agent writes in a red-first test commit. Run the built, stamped,
    cover-enabled binary through godog on Linux, macOS and Windows; keep the domain unit
    tests fake-backed and let infrastructure tests fake a failing reader instead of
    assuming Unix permission bits. Harvest the count command's entry point, kong UI,
    four-shell completion, version, scenario harness, quoted-argument steps and real-git
    resolution from the owner's itos-template without its generator behaviour: the root
    command holds count, version, completion and the hidden __complete, completion
    answers from kong's model, and no input value is read as a global flag. Structured
    logs stay quiet below warnings, JSON off a terminal and text on one, without colour.
    Harvest GoReleaser, the reusable release workflow and internal/release, retargeting
    the hard-coded binary path and keeping upstream identities: a made project's binary
    releases are not this template's release protocol, so this branch's CI must not run a
    binary release on a root where no binary exists. Add the actual kong, godog and
    terminal dependencies from the source pins, tidy the lockfiles, regenerate the agent
    rules from the actual config, and keep no generator-specific lint exception. Prove
    changed and newly imported paths with fresh fail-uncovered, all-tests mutation
    records, killing survivors rather than reshaping code or weakening a gate.
  done_when:
    - run: itos config check
    - run: tools/bin/doc-caps
    - run: >-
        test -f cmd/go-template-itos/main.go &&
        test -f .goreleaser.yaml && test -f .github/workflows/release.yml &&
        test -f features/smoke.yaml
    - run: go mod verify
    - run: go mod tidy -diff
    - run: go build ./...
    - run: go vet ./...
    - run: itos tests smoke check scenario
    - run: go test ./...
    - run: tools/bin/domain-coverage
    - run: go run ./cmd/go-template-itos count README.md --json
- id: T-4
  type: build
  title: Keep the template's itos data out of every render, and drop first_commit's footer
  why: >
    Each branch already keeps its own config, ledger and registry, scoped to the work that happened
    on it: main holds T-1, stack/go adds T-2, go/cli adds T-3 and the count-cli slice, and no branch
    holds another's work. Nothing is duplicated that ought to be one thing, so no branch is added,
    nothing merges up into anything, and no CI plan moves: every branch keeps the gates, the plan,
    the proof and the task checks it has today. What a render would inherit is the problem, and the
    fix is two lines of the manifest. Add to it a template_only naming itos.yaml and tasks, the two
    paths a render has no use for, which IsTemplateOnly already excludes from every render beside
    the manifest itself. Drop the Task footer from first_commit: a render is committed before the
    made project has any ledger, so the footer names nothing, and in a made project T-1 means Adopt
    itos rather than anything this repository decides. The made project's own setup comes from the
    template's declared setup steps per ADR-0031, a later piece.
  done_when:
    - run: m=itos-template.yaml && grep -q '^template_only:' "$m" && grep -qE '^  - itos\.yaml$' "$m" && grep -qE '^  - tasks$' "$m" && ! grep -q 'Task:' "$m"
- id: T-5
  type: build
  title: The manifest declares what every render must pass, so check proves something
  why: >
    check runs and passes today and proves nothing: the manifest names no checks, so every
    combination renders and has nothing to run, and its only output is the warning that no check is
    marked as scanning the renders for credentials. Declare the checks beside what they check, per
    branch as docs/manifest.md says: the root's, stack/go's own, the cli feature's own, and a
    combination running the root's then the stack's then the features' in order. What each branch
    already runs in its CI is what its renders must pass, so a render is proved as strongly as the
    branch it came from. Checks run with no shell, so the gofmt pipeline is written as [sh, -c, …]
    and every other is a plain word list, each word's literals replaced by the answers as a file's
    contents are. No check is an itos one: after T-4 a render carries none of this repository's itos
    data, so itos config check and the like would have nothing to read, and the made project's own
    setup comes from the template's declared setup steps per ADR-0031. Pin gitleaks the way
    tools/bin/pinned pins the others, at a version and its release's own checksum, and mark it
    scans: [credentials] as the root's check, so every render is scanned and check stops warning.
    itos-template scans no render itself and knows no tool that does: the template names its own.
    The pin lands on the Go stack with the other tools itos.yaml's plan runs, never on the root,
    which has no toolchain; the manifest is one file on the root and merges down, so every render of
    a stack already carries the tool the root's check runs.
  done_when:
    - run: "m=itos-template.yaml && grep -q '^checks:' \"$m\" && grep -q 'scans: \\[credentials\\]' \"$m\" && grep -q 'gitleaks' \"$m\" && grep -qE '^  - name: go$' \"$m\" && grep -qE '^  - name: cli$' \"$m\""
    - run: m=itos-template.yaml && grep -q 'gofmt' "$m" && grep -q 'go, build' "$m" && grep -q 'go, vet' "$m" && grep -q 'go, mod, verify' "$m" && grep -q 'go, mod, tidy, -diff' "$m" && grep -q 'golangci-lint' "$m" && grep -q 'govulncheck' "$m" && grep -q 'go, test' "$m" && grep -q 'domain-coverage' "$m" && grep -q 'mutation, sample' "$m" && grep -q 'go, test, ./features' "$m"
    - run: test ! -f tools/bin/pinned || grep -q 'gitleaks' tools/bin/pinned
- id: T-6
  type: style
  title: A rendered file is gofmt-clean whatever the substituted project name is
  why: >
    The first run of check over the checks T-5 declared found this.
    internal/release/releasetest/releasetest.go holds its fixture file names as the keys of one map
    literal, and two of those keys carry the project name: cmd/go-template-itos/main.go and its
    test. gofmt aligns the values of adjacent entries into a column sized by the longest key, so
    substituting a shorter name moves that column and every line in the block. The branch itself is
    gofmt-clean, so its own CI never sees this class of defect; only a render does, which is what
    the checks are for. Break the alignment group rather than chase a column, so the file is
    gofmt-clean at any name length: a blank line between composite-literal entries does it, verified
    on this shape, and gofmt then leaves each entry alone. Run gofmt after the edit, since the
    padding the old column left is then stale. Leave the checks alone: the manifest already declares
    the gofmt check and check already runs it, so a recurrence is caught without a new rule, and
    weakening it to make this green is not an option. Touching internal means the item owes the
    branch's code proof over cmd and internal, with fresh .metrics/mutate records, fail-uncovered
    and all-tests, and reshaping the fixture to hold no mutation site is not an option either.
  done_when:
    - run: d=$(mktemp -d); trap 'rm -rf "$d"' EXIT; rc=0; for n in x a-much-longer-project-name; do rm -rf "$d/$n"; mkdir -p "$d/$n"; for f in $(git ls-files "*.go"); do mkdir -p "$d/$n/$(dirname "$f")" || exit 1; sed "s/go-template-itos/$n/g" "$f" > "$d/$n/$f" || exit 1; done; out=$(gofmt -l "$d/$n") || exit 1; if [ -n "$out" ]; then echo "$out"; rc=1; fi; done; exit $rc
- id: T-7
  type: docs
  title: Prove the first template end to end and say it is ready
  why: >
    The umbrella first-template, and the closing claim no earlier item makes because it was not true
    yet: that a project made from this template is a working project, and that the template may be
    advertised as ready. PLAN.md's order of work says it is advertised as ready only after the
    template-check piece passes, so this is where that happens and nowhere else. Three things have
    to hold, and one run proves all of them. The public template renders every combination its
    manifest allows and each render passes the checks the manifest names, with the credential scan
    marked so no warning is left. A project made from the public template builds, vets and tests,
    runs its own command, carries none of this repository's itos data, and has a first commit that
    names no task. And this repository's own documents stop claiming the template is unfinished,
    because after this it is not: the README status, PLAN.md's order of work and the sentence in
    docs/security.md that said no render credential scan was installed. Do not re-render
    itos-container here and do not treat it as a deliverable; it was a working sample taken while
    the manifest was still incomplete. The check builds this repository's generator from its public
    source and proves the template against the public URL, so it proves what a person can actually
    get rather than a local copy.
- id: T-8
  type: docs
  title: Document the shared engineering practices every project inherits
  why: >
    Put language- and interface-independent practices on main, so every stack inherits them.
    The person explicitly wants this split: shared engineering policy on main, Go-specific policy
    and tooling on stack/go, and CLI-specific policy and tooling on go/cli. Harvest the general
    design and testing rules already used by donvargax/itos-template: vertical slices with thin
    entry points, domain-owned behavior through ports, no copying domain types into options or
    DTOs, adapters translating outside models only where needed, outcome-based domain tests with
    fakes rather than mocks, public-entry-point acceptance tests, person-owned library choices,
    OS differences as values, and honest claims about checks. Keep AGENTS.md short and point it
    to docs/engineering.md. The guide distinguishes policy from what a branch currently enforces;
    it adds no Go tool, CLI contract, scenario, workflow, or new quality gate to the root.
    Go enforcement, CLI guidance, generated-project setup and releases are separate items. Shared
    docs merge downward without rewriting history; child branches retain their own gates and work
    history. Do not copy the generator's domain, task IDs, mutation cache or historical decisions.
  done_when:
    - run: test -f docs/engineering.md && grep -q 'docs/engineering.md' AGENTS.md
    - run: grep -q '## Design' docs/engineering.md && grep -q '## Tests' docs/engineering.md && grep -q '## Dependencies' docs/engineering.md && grep -q '## What is enforced' docs/engineering.md
- id: T-9
  type: ci
  title: Enforce the Go domain, ports, adapter and mock-free test boundaries
  why: >
    Implement only on stack/go. The root shared policy is docs/engineering.md; language-specific
    enforcement belongs beside its Go code and will merge downward into go/cli after exact-head CI,
    never upward into main. Harvest the existing depguard approach from
    donvargax/itos-template/.golangci.yml, adapting the real target module and layout. Domain and
    ports, including tests, must not import the application/command layer or concrete disk/input
    adapters. Production domain and ports perform no OS/network I/O; tests may read fixtures.
    Production adapters may import project ports but no project domain/application or other adapter
    implementations; adapter tests may use porttest fakes. Ban the five source mock-library families
    in every package/test and preserve Rapid-only-in-domain-tests and all existing
    lint/SAST/coverage/proof gates. Add a small architecture-check self-test driven by the actual
    checksum-pinned golangci-lint and this branch actual configuration, with compile-valid isolated
    positive/negative fixtures, local stubs where needed rather than new third-party dependencies,
    and no custom analyzer or copied generator package names. A negative case must fail for its
    intended depguard violation, not invalid Go/import cycles/loading errors; positive port/fake
    imports and fixture I/O in tests must pass. Commit the self-test first as a test commit and see
    it expose the missing rules before adding enforcement; hooks run the configured checks, and the
    task implementation commits are pushed together only once the checks pass. Install this
    self-test in stack/go CI, with checks preserving Windows/macOS/Linux portability; do not change
    a public interface, CLI scenario, root manifest, or CLI-only Kong/exit-type rules. Root manifest
    registration and CLI integration adjustments get separate items. If any existing test
    contradicts the agreed boundary, stop with evidence rather than deleting coverage or broadening
    the rule. Source harvest provenance and MIT permission remain as documented.
    The test commits 3461464, 9328e34 and 76a289d preceded configuration commit 1c16636.
    The normalized red run compiled 85 independent fixtures before showing missing domain/port,
    adapter and mock-family refusals; it did not accept fixture-loading failures as enforcement.
    The matrix grew to 99 fixtures before the configuration landed. Hosted run 37982764398
    then exposed checker path assumptions on macOS and Windows, not invalid fixtures: macOS
    resolves temporary-folder symlinks and Windows uses a different drive. Commit 376037f
    requested absolute linter paths and resolved fixture symlinks without relaxing any rule.
    Exact head 376037fe8f2cd925c6f4c07b5136a10a90e752ab passed every job in run 37983078990,
    https://github.com/donvargax/go-template-itos/actions/runs/37983078990. All 99 fixtures pass;
    configured internal code-proof paths were unchanged. The coordinator closed T-9 after
    verifying that head and run. Manifest registration and CLI integration are separate items.
  done_when:
    - run: tools/bin/architecture-check
      timeout: 240
    - run: test -x tools/bin/architecture-check && grep -q architecture-check itos.yaml
    - run: tools/bin/pinned golangci-lint run ./...
      timeout: 300
- id: T-10
  type: docs
  title: Document the Go design and quality contract on the Go stack
  why: >
    Own this guide on stack/go and merge it downward into go/cli; main keeps only
    docs/engineering.md. Write docs/go.md and a short AGENTS.md reference without duplicating the
    shared design policy. Describe the actual domain/ports/disk/fake layout, import-boundary
    enforcement and its self-test, Rapid properties, fixture I/O test exceptions, platform-as-value
    rule, Go module verification/tidy checks, checksum-pinned tools, lint/SAST/vulnerabilities,
    per-domain coverage, and changed-code proof at item closure versus CI mutation sampling.
    Document how to update explicit package boundary lists when adding a domain, slice or adapter.
    No CLI flags/output/exit contract, Kong rule or binary release claim belongs here. No new tool,
    gate, dependency, code or acceptance scenario is installed by this documentation task. State the
    generated-project policy and ordinary-main CI gaps accurately until those separate items prove
    inheritance; keep active checks distinct from plans. Harvest source general Go policy and retain
    provenance, not generator imports, historical task IDs or mutation records. Update
    stack-specific agent/orchestration/upgrade prose only where it is inaccurate; it remains correct
    that this stack has no public CLI.
  done_when:
    - run: test -f docs/go.md && grep -q docs/go.md AGENTS.md
    - run: grep -q "## Packages" docs/go.md && grep -q "## Tests" docs/go.md && grep -q "## Quality checks" docs/go.md && grep -q "## Made projects" docs/go.md
- id: T-11
  type: ci
  title: Bring the Go stack boundaries, guide and records into the CLI feature
  why: >
    Merge stack/go (182d58c or later) into go/cli; it already carries main. Shared changes merge
    downward only. Keep go/cli's own work registry, itos.yaml and docs wording where they describe
    the feature, and merge task ledgers additively in id order so CI resolves footers of imported
    commits. Take tasks/asks.yaml and docs/decisions from the merge whole: questions are asked and
    recorded on main only (decision 3). go/cli gains the stack's CI plan step
    tools/bin/architecture-check in its own itos.yaml, with the platform job and fixtures the merge
    brings. T-9's depguard rules name only stack packages, so name go/cli's packages as docs/go.md
    describes, with compile-valid accept and reject fixtures for each new rule in
    tools/testdata/architecture. The input adapter is named by the infra rule already. Add an
    application rule for internal/count/command, which may import the domain, its ports and
    internal/cli but no concrete adapter (disk, input). Add a kong rule harvested from
    itos-template: kong only in cmd/** and internal/cli/**. internal/release and internal/version
    are build helpers outside the slice and stay unlisted. Existing code that a new rule flags is a
    finding to report before changing it, not a rule to loosen. Update go/cli's docs/go.md to
    describe its actual entry point, packages and these rules instead of the stack's no-cmd
    sentence; interface contract prose belongs to cli-contract, not here. No behavior, scenario or
    dependency changes; the root manifest's check lists are separate main work. Ledgers merge downward, so main and
    stack/go must never reuse T-11.
    The application rule covers tests too, as the domain and ports rules do: command_test.go
    wrapped porttest.Files in the input adapter to feed standard input, which the rule flags, so
    that test uses the porttest fake directly, standard input being its "-" key; the input
    adapter's tests and the scenarios hold standard input. The fixtures add internal/count/command
    beside the stack's stand-in internal/count/app as a reject target of the domain, ports and
    infra rules. The task's checks pass only once the rules land, so its commits are pushed
    together; cc3d9b7 was pushed alone and its run is red on that check alone.
  done_when:
    - run: grep -q "tools/bin/architecture-check" itos.yaml && test -x tools/bin/architecture-check
    - run: grep -q "internal/count/command" .golangci.yml && grep -q "alecthomas/kong" .golangci.yml
    - run: test -f docs/go.md && grep -q docs/go.md AGENTS.md && test -f docs/decisions/0003-every-question-is-asked-and-recorded-on-main.md
- id: T-12
  type: docs
  title: Say in go/cli agent and orchestration notes that the public CLI is here
  why: >
    AGENTS.md said this branch has no public CLI yet, and docs/ORCHESTRATING.md that it has no
    public CLI, godog runner or binary release job and that cmd/ joins the proof later. On go/cli
    the CLI, its scenarios and runner exist and the proof covers cmd and internal, so an agent
    reading the notes started from the stack stage. The release workflow is present but runs only
    on a made project's main; this branch cuts no binary release and cli-releases finishes that
    wiring, so the notes say so rather than claiming releases. PLAN.md's order of work describes
    the stack stage as a stage and stays. Found while merging stack/go for T-11.
  done_when:
    - run: '! grep -q "not the public CLI yet" AGENTS.md && ! grep -q "no public CLI" docs/ORCHESTRATING.md && ! grep -q "add .cmd/. with the public CLI" docs/ORCHESTRATING.md'
- id: T-13
  type: build
  title: Every Go render runs the import-boundary self-test
  why: >
    T-9 added tools/bin/architecture-check to stack/go's CI and T-11 to go/cli's, but the manifest's
    go and cli check lists still copy the plans from before them, so itos-template check proves a
    render's lint rules without proving those rules still catch what they should. Add
    [tools/bin/architecture-check] to both lists, right after golangci-lint where the branches'
    plans run it; it runs go test over fixtures and the pinned linter, no shell and no itos. The
    smoke check stays out: it is an itos command, and a render carries no itos data (T-5). The
    manifest is one root file, so the change lands on main and merges down into stack/go and then
    go/cli with normal merge commits, each keeping the receiving branch's registry and config,
    merging ledgers additively in id order. Prove it with itos-template check on both combinations
    at the merged heads, and record what it printed. A render whose fixtures fail after the literals
    are replaced is a finding to report, not a check to drop.
  done_when:
    - run: test "$(grep -c "tools/bin/architecture-check" itos-template.yaml)" -ge 2
- id: T-14
  type: feat
  title: A non-cumulative flag given twice is a usage error
  why: >
    Decision 1 (q-1): the default CLI refuses a non-cumulative flag given twice with usage exit 2,
    as itos-template does, a switch and its --no- pair counting as one flag, so --json --json and
    --json --no-json are both refused, naming the flag. Explicitly cumulative flags stay
    repeatable, but count, version and completion have none, so no scenario claims one. Today
    every repeated form exits 0, and --no-json --json even prints the plain output, so the last
    flag does not reliably win either. The environment variable is not the flag given twice:
    GO_TEMPLATE_ITOS_JSON=1 with --no-json still prints the plain output. Live ID-COUNT-06 says
    --json --no-json prints the plain output; the feat commit rewrites it to that environment
    case, which holds before and after, and says the change is intentional for anyone upgrading.
    -- still ends the options and a data argument is never read as a flag (ID-CLI and ID-COUNT
    scenarios already hold that). Harvest the once-only tracing from itos-template's
    internal/cli/flags.go, which go/cli's flags.go comment already claims and does not do, rather
    than writing a second parser. No new flag, and no change to the JSON usage-error shape.
  done_when:
    - run: '! grep -q "@wip" features/cli.feature && grep -q "@T-14" features/cli.feature'
- id: T-15
  type: docs
  title: Write the shared configuration-format guide
  why: >
    The person asked that a made CLI carry docs/CONFIG.md beside docs/CLI.md. Its rules hold for
    any interface, so the guide lives on main and merges down; the CLI feature adds only flags,
    environment variables and precedence in its own docs/CLI.md (cli-contract). Harvest the general
    rules of itos-template's docs/CONFIG.md, keeping its sources and provenance: defaults written
    down and printable, JSON data written as YAML, refusing what JSON cannot say (tags, anchors,
    several documents, duplicate keys), unknown keys refused, every problem named by its key path,
    a version on every file, snake-case keys, named lists as lists of objects, whole values, no
    secrets, documented keys and a schema. Leave out the generator's manifest and record, its
    decision and task numbers. The template has no configuration file, loader, schema or
    defaults printer, so the guide says a project applies the rules when it adds its first file
    and claims none of them is implemented. Formats owned by other tools (go.mod, linters, CI,
    itos.yaml) keep their own rules.
  done_when:
    - run: test -f docs/CONFIG.md && grep -q docs/CONFIG.md AGENTS.md
    - run: '! grep -qiE "decision [0-9]|manifest|T-[0-9]|\.itos-template" docs/CONFIG.md'
- id: T-16
  type: docs
  title: Write the CLI design guide for the CLI feature
  why: >
    The person asked that a made CLI carry docs/CLI.md beside docs/CONFIG.md. Harvest the general
    rules of itos-template's docs/CLI.md, itself taken from itos, keeping their sources and
    provenance: the contract with scripts (exit code and --json less message and fix), the exit
    codes, command grammar, help and version, flags and arguments with decision 1's once-only
    rule (T-14), output channels and schema-1 JSON for successes and failures, errors, the
    GO_TEMPLATE_ITOS_ environment variables and their order against flags, structured logs on
    stderr, changing the interface, and four-shell completion. Leave out generator commands,
    prompts, manifests and the itos extension entry point. Describe the CLI as it behaves: where it
    falls short of a rule (no help command, no examples in the help, the exhaustive error lint of
    cli-exhaustive-errors, no release and so no previous-release check until cli-releases), the
    rule says so and names the item. Configuration-file rules stay in docs/CONFIG.md. No flag,
    scenario, output or classification changes in this task.
  done_when:
    - run: test -f docs/CLI.md && grep -q docs/CLI.md AGENTS.md
    - run: grep -q GO_TEMPLATE_ITOS_JSON docs/CLI.md && grep -q COUNT_INPUT_MISSING docs/CLI.md && grep -q made-project-ci docs/CLI.md && grep -q docs/CONFIG.md docs/CLI.md
    - run: '! grep -qE "itos-template [a-z]|ITOS_TEMPLATE_|manifest|decision (4|17|25|35)" docs/CLI.md'
- id: T-17
  type: ci
  title: The linter refuses an error switch that leaves a failure kind out
  why: >
    docs/CLI.md rule 32 says each sealed failure set gets its exit code in one switch with no
    default and a lint refusing a switch that leaves a kind out; today internal/cli's readProblem
    switch over port.ReadFailure is complete only by review. The person chose gochecksumtype (q-5):
    it is bundled in the pinned golangci-lint, so no tool or dependency is added, and itos-template
    uses it. Enable it in go/cli's .golangci.yml with default-signifies-exhaustive false and a
    comment in the existing style, harvested with provenance. Annotate port.ReadFailure with
    //sumtype:decl; that file is the stack's, so the one comment line is the only change to it here,
    and any other sealed set the CLI switches over is annotated the same way. Prove it in
    tools/testdata/architecture's self-test, which runs the pinned linter with this configuration:
    a compile-valid fixture whose switch omits a kind is refused, and one naming every kind passes.
    The switch keeps starting from the internal error, so an unclassified error still exits 70.
    Exit codes, JSON envelopes and every live scenario stay as they are. Once green, docs/CLI.md
    rule 32 drops its not-yet sentence in the same item.
  done_when:
    - run: grep -q gochecksumtype .golangci.yml && grep -q "default-signifies-exhaustive. false" .golangci.yml
    - run: grep -q "//sumtype:decl" internal/count/port/files.go && grep -q gochecksumtype tools/testdata/architecture/check_test.go
    - run: '! grep -q "cli-exhaustive-errors" docs/CLI.md'
- id: T-18
  type: docs
  title: Say in the guides that a lint holds every sealed failure set
  why: >
    T-17 enabled gochecksumtype, but docs/go.md still lists golangci-lint as the standard linters
    plus depguard, gosec and revive, and never says that a new sealed failure set needs
    //sumtype:decl and one exhaustive switch in internal/cli, so a set added without the
    annotation would go unchecked unnoticed. docs/CLI.md rule 32 lost its not-yet sentence with
    T-17 and no longer says a lint enforces the switch, as itos-template's rule does. Name the
    linter in both, with the step for a new sealed set.
  done_when:
    - run: grep -q gochecksumtype docs/go.md && grep -q "sumtype:decl" docs/go.md && grep -q gochecksumtype docs/CLI.md
- id: T-19
  type: docs
  title: Fix T-16's check that T-17 made stale
  why: >
    T-16's second check required docs/CLI.md to name cli-exhaustive-errors, the item then pending,
    and T-17 rightly removed that sentence, so itos task T-16 reports failing and any later commit
    naming T-16 would be refused. The check meant that the guide names the items still pending;
    it now asks for cli-releases, which rule and contract still name, instead.
  done_when:
    - run: itos task T-16
- id: T-20
  type: build
  title: Complete the made CLI binary release pipeline
  why: >
    .github/workflows/release.yml calls tools/bin/release-version and tools/bin/release-notes,
    which do not exist here, and no job calls it. Harvest both helpers with their tests and
    release-notes' cliff.toml from itos-template's tools/bin, adapted to this module and binary
    and keeping provenance and license notices; they use internal/release, which is already here.
    Pin git-cliff in tools/bin/pinned at itos-template's version with its release's own checksums
    (q-7). Add the release job to ci.yml as itos-template has it: after the ci and platform jobs,
    only on a push to main, the only job with write, id-token and attestation permissions, so a
    pull request or a Renovate branch never releases (q-6). On the template it never runs, since
    go/cli is never main. On a generated main it cannot run until made-project-ci makes the Go
    jobs and the itos plan work there; that proof belongs to made-project-ci, and docs say so
    rather than claim releases run. Run the helpers' tests in go/cli's CI plan, which today tests
    only cmd and internal. Keep .goreleaser.yaml's archives, checksums and attestation as they are.
    Update release.yml's header, docs/CLI.md's contract and the go/cli notes to say what now exists
    and what waits on made-project-ci; T-16's check, which looks for cli-releases in docs/CLI.md,
    then looks for made-project-ci. Never publish anything from the template.
  done_when:
    - run: test -f tools/bin/release-version/main.go && test -f tools/bin/release-notes/main.go && test -f tools/bin/release-notes/cliff.toml
    - run: 'grep -q "git-cliff)" tools/bin/pinned && grep -q "uses: ./.github/workflows/release.yml" .github/workflows/ci.yml && grep -q "tools/bin/release" itos.yaml'
    - run: itos task T-16
- id: T-21
  type: ci
  title: CI re-proves every render on each template push and weekly
  why: >
    No workflow runs itos-template check, so a change to the manifest or to a branch a render
    carries can break a render while every branch's own CI stays green; T-13 had to run it by
    hand. Add .github/workflows/template-check.yml on main (q-8): on every push to main, stack/**
    and go/**, and on a weekly schedule, with contents read only and runs of one ref cancelling
    older ones. The check renders origin's branch heads, so any branch's push re-proves both
    combinations. Install itos-template with go install at v0.19.0 (q-9), verified by Go's
    checksum database; Go comes from actions/setup-go, pinned by digest as the other workflows
    pin it, at the toolchain go/cli's go.mod names, read from that branch so it moves with the
    code. Run check over the repository with fixed sample answers, as T-7 does, and fail on a
    non-zero exit, any warning, or anything but every combination passing. List the workflow in
    the manifest's template_only so a made project never gets it. The file is root-owned, like
    the manifest: merge main into stack/go and then go/cli with normal merge commits, each keeping
    the receiving branch's registry and config, so every branch carries the same file. Main's
    ci.yml and the branches' own ci.yml stay as they are. Prove it with the workflow's own green
    run on each branch's head.
  done_when:
    - run: test -f .github/workflows/template-check.yml && grep -q "itos-template@v0.19.0" .github/workflows/template-check.yml && grep -q "schedule" .github/workflows/template-check.yml
    - run: grep -qE "^  - \.github/workflows/template-check\.yml$" itos-template.yaml
- id: T-22
  type: test
  title: The release notes tests pass in a render
  why: >
    T-21's check found go + cli failing at go test ./... in a render:
    tools/bin/release-notes/main_test.go expects the literal
    https://github.com/itos-corp/go-template-itos/compare/..., which holds the module literal, so a
    render turns it into https://example.com/blue/fox/compare/..., while main.go builds the address
    from repository, itos-corp/go-template-itos, which renders as acme/blue-fox. The tests came with
    T-20 (8579733). Build each expected address in the tests from repository as the code does, so
    they name what the code prints under any answers. Search the helpers' other tests and the whole
    branch for the same pattern, a literal that holds the module path where the code builds from
    owner and name, and fix each. Prove it with itos-template check (v0.19.0) passing both
    combinations at the pushed heads. No behaviour change in the helpers.
  done_when:
    - run: "! grep -q \"https://github.com/itos-corp/go-template-itos/compare\" tools/bin/release-notes/main_test.go"
- id: T-23
  type: ci
  title: A passing Template check clears the parents' stale red runs
  why: >
    The render merges the branches, and a parent's new ledger entry conflicts with its children's
    until the merge down reaches go/cli, so that parent head's Template check run stays red and
    nothing runs it again (T-21, run 38021113542). The person chose an automatic rerun (q-10):
    when Template check passes on a push, a job re-runs the latest failed Template check of
    main's and stack/go's heads, other than its own run, using gh with the workflow's token. Only
    that job gets actions write; the check job stays contents read. A run that is not the head's
    latest, or a head whose latest passed, is left alone, and it never loops: a rerun is not a
    push and starts no rerun of its own. The rerun is deprecated in favour of per-branch-ledgers:
    the workflow says so beside the job, and that idea removes it once no render merge
    conflicts. The workflow is root-owned, so merge main into stack/go and then go/cli as T-21
    did. Prove it by a parent's red run turning green through the job, not by hand.
  done_when:
    - run: grep -q "actions. write" .github/workflows/template-check.yml && grep -q "per-branch-ledgers" .github/workflows/template-check.yml && grep -q "gh run rerun" .github/workflows/template-check.yml
- id: T-24
  type: build
  title: Move every branch to itos 7.0.0-rc.4 and retire decision 4
  why: >
    itos 7.0.0-rc.4 mints every item and scenario id through the counter refs/itos/ids on the
    remote, shared by all branches (itos decision 45, slice-102), which ends the cross-branch id
    clash decision 4 works around by hand. Every branch pins 7.0.0-rc.1. The person approved
    moving to rc.4, a pre-release as rc.1 is. On each of main, stack/go and go/cli, move the pin
    with itos pin and the workflow action with it, as docs/upgrading.md and the release's
    Upgrading section say, and apply every Upgrading step since rc.1 that the branch's config
    meets: rc.3 moves the code proof from work done into itos ci run, and rc.2 has work done drop
    a closed task's checks. Regenerate the agent rules with itos init --agent-rules, and correct
    the prose that describes the old flow (AGENTS.md, docs/ORCHESTRATING.md, docs/go.md,
    docs/upgrading.md) on each branch where it says so. A mint takes one past the higher of the
    counter and the highest id the branch holds; every branch holds T-24, so the first mint is
    T-25 or above. Do not mint an id to test it: record refs/itos/ids' absence before, and the
    coordinator checks the counter on its next real mint. Supersede decision 4 with a record
    saying ids are minted by itos, and remove its command from the notes. Questions are not
    counter-minted, so decision 3 stands. Branches move independently, since itos.yaml and
    ci.yml are each branch's own; merge main down afterwards for the shared docs, as earlier
    items did. A gate that rc.4 refuses on existing work is a finding to report, not a check to
    weaken.
- id: T-25
  type: ci
  title: Renovate updates every branch that holds code
  why: >
    Renovate reads its config from the default branch, main, which enables only github-actions and
    renovate-config, so the Go modules on stack/go and go/cli get no updates, and the branches' own
    configs, which enable gomod, are never read. main's file names baseBranchPatterns (main,
    stack/go, go/cli; Renovate renamed baseBranches, and strict validation refuses the old key)
    with useBaseBranchConfig merge, so each base branch's request is shaped by that branch's own
    renovate.json5 and judged by its own CI. Those two keys live in main's file only: a render
    ships the bottom branch's file to a made project, which has only main, and Renovate reads them
    from the default branch alone. Group one dependency's requests with groupName {{depName}} so
    they move together; skew between branches is acceptable. commitBody names the base branch, not
    main, in every file. Trailers follow q-15: commitTrailers is mergeable, so the branch files
    carry none, and main's file gives Task T-1 to main's requests and Task T-2 to stack/go's and
    go/cli's through package rules matching each base branch; a made project's file then has no
    trailer. Keep the owner presets, ignoreDeps for itos, the pinned action digests, the cooldown
    and automerge on green. Each file passes renovate-config-validator --strict. Renovate was
    installed while this was specified, but no request has landed, so docs/upgrading.md says so
    until renovate-proof. Change main's file, then stack/go's and go/cli's, merging main down as
    earlier items did.
- id: T-26
  type: build
  title: Move every branch to itos 7.0.0-rc.5
  why: >
    itos 7.0.0-rc.5 adds itos init --policy (slice-108, closing donvargax/itos#33), which
    made-project-policy needs: a made project's setup step runs it over the branch's
    itos-policy.yaml (q-13). Every branch pins 7.0.0-rc.4, and the release adds no breaking change
    past what T-24 applied; its Upgrading section is read anyway and any step the branches' configs
    meet is applied. On each of main, stack/go and go/cli, move the pin with itos pin 7.0.0-rc.5 and
    the itos workflow action with it, go/cli's release.yml included, pinned by the release's commit,
    and regenerate the agent rules. Branches move independently; merge main down afterwards for the
    ledger, as earlier items did, keeping each branch's itos.yaml, ci.yml and registry. A gate rc.5
    refuses on existing work is a finding, not a check to weaken.
- id: T-27
  type: build
  title: A made project adopts the template's quality policy at setup
  why: >
    A made project gets this template's gates in its files but none of its itos data: renders drop
    itos.yaml and tasks, so it has no commit rules, CI plan or code proof until it adopts a policy.
    itos 7.0.0's init --policy (donvargax/itos#33, slice-108) makes a fresh project from a
    complete itos config: it copies the commit rules, CI plan and proof config, resets commits.since
    to the project's HEAD and drops footers' since, and starts an empty registry and a ledger
    holding only its adoption task T-1, importing none of the template's tasks, questions, decisions
    or proof results. The generator stays unaware of itos (decision 2): the manifest moves to
    version 5 and lists setup steps, which itos-template new prints for the person to run and never
    runs itself. Settled by the person: each rendering branch keeps a complete itos-policy.yaml at
    its top, and the setup steps run itos init --policy itos-policy.yaml and then delete the file,
    so a made project has one config, its itos.yaml (q-13). A CI step on each such branch fails when
    itos-policy.yaml differs from the branch's own itos.yaml beyond a listed set of template-only
    differences (q-14). A made project's policy requires no Task footer on build and ci commits, so
    Renovate's requests, whose branch configs carry no trailer since T-25, pass its rules (q-15).
    Only stack/go and go/cli carry itos-policy.yaml: a render ships the bottom branch's file, and
    main never renders alone, so a file on main would only conflict on every merge down. Each is the
    branch's itos.yaml less what belongs to the template alone: its commit rules (types, scopes,
    footers with Task not required for build and ci, no since), its Go and CLI CI steps and
    proof.code, with the template-only steps removed (the check of the template's own document list
    and anything reading the template's ledger), and the ledger and registry paths a fresh project
    uses. The listed differences in the drift check are exactly those, each with its reason in a
    comment. The check runs in each branch's itos.yaml plan, with no new tool: plain sh and the
    tools the branch already pins. The manifest's setup steps go on the go stack, so both
    combinations print them once, in order: itos init --policy itos-policy.yaml, then removing itos-
    policy.yaml. The init offers (plugin, git shim, agent rules) stay the person's to answer when
    they run it. itos-policy.yaml is not in template_only. Prove it on both combinations: render
    with itos-template new at the version the Template check pins, run the printed steps with itos
    7.0.0 in the made project, then itos config check, itos task, itos ci plan over the made
    project's first commits, and the made project's own go build and tests. The made project's CI on
    an ordinary main is made-project-ci's, not this item's: its Go jobs still skip main, so do not
    claim it runs. Template check stays green on every head. Tried on a go + cli render before this
    was specified (itos-template 0.19.0, itos 7.0.0-rc.5): init --policy refused, because the render
    ships features/smoke.yaml and init never writes over itos data. The person keeps the smoke set
    in renders: it is part of the template's code, its selections and reasons reviewed like code,
    and a derived set loses every reason. So itos had to adopt an existing valid smoke set,
    reported as donvargax/itos#39 and fixed in 7.0.0 (6c72b7f keeps a smoke set the project has
    when the smoke check passes), which every branch pins since T-30. No setup step moves the file
    aside; if 7.0.0 still refuses it, stop and report rather than work around it. With the file
    removed, init otherwise passed: itos.yaml, a ledger holding T-1, an
    empty registry and a smoke set over the 3 feature files, with itos config check and the smoke
    check green. go/cli's tests use the built-in gherkin adapter, so slice-110's command-adapter
    case does not apply. The render also ships .metrics/mutate/ and itos-cc.yaml's reviewed
    exceptions, kept as the made project's baseline (q-16): its code starts as the template's,
    renamed, and its own proof judges only its changes after setup. Init's offers and its printed
    adoption commit stay the person's; the setup steps end after the policy file is removed.
- id: T-28
  type: docs
  title: Keep the template's own records and notes out of made projects
  why: >
    A render drops only itos.yaml, tasks and the template-check workflow, so a made project ships
    PLAN.md (the template's plan and branch layout), docs/ORCHESTRATING.md (the coordination notes
    for three branches), a README.md that calls it a template, an AGENTS.md mixing template rules
    with project rules, and decisions 2 to 5, which govern running the template. The person chose
    to split by audience (q-17): PLAN.md and docs/ORCHESTRATING.md join template_only; on stack/go
    and go/cli, README.md and AGENTS.md are written for the made project, and their template-facing
    parts (provenance and harvest rules, the branch layout, merging down, template boundaries, the
    reading order that starts at PLAN.md) move to TEMPLATE.md, also in template_only. AGENTS.md
    tells a reader to read TEMPLATE.md first only while that file exists, so the sentence is true
    in both places. main's README.md stays the template's front page, since main never renders
    alone. Provenance that a project must keep (CONTRIBUTORS.md, notices, harvest comments in code
    and guides) stays. A made project gets only decision 1, which binds its CLI, with a decisions
    index that lists only it (q-18): decisions 2 to 5 join template_only, and the index a render
    ships must name exactly the records it ships, without a second hand-kept list that can drift
    from itos's own. If itos cannot keep that true, stop and report before improvising. The
    branches' file-list check in itos.yaml keeps holding the template's own files; T-27's policy
    leaves it out. Prove it by rendering both combinations and reading what ships, and by
    Template check staying green.
- id: T-29
  type: build
  title: A render ships decision 1 alone
  why: >
    T-28 left decisions 2 to 5 in renders: itos writes docs/decisions/README.md from every record in
    the folder, so excluding records alone would ship an index linking files the render lacks. The
    person chose a template-only fix (q-19, revising q-18's index clause): decisions 2 to 5 and
    docs/decisions/README.md join the manifest's template_only, with a comment saying why, so a
    render ships decision 1, the one record that binds a made CLI, and the made project's index
    appears when it records its first decision. A decision the template records later that binds
    made projects stays out of template_only; one about running the template joins it, and
    TEMPLATE.md says so. Prove it by rendering both combinations and listing docs/decisions, and in
    a scratch made project adopting a policy and recording one decision, that the index itos
    writes names decision 1 beside it. Template check stays green.
- id: T-30
  type: build
  title: Move every branch to itos 7.0.0
  why: >
    itos 7.0.0 is the final release after rc.5, which every branch pins since T-26. Its init
    --policy keeps a smoke set the project already has when the smoke check passes (6c72b7f, closing
    donvargax/itos#39), which T-27's go + cli setup was deferred on: a render ships
    features/smoke.yaml and rc.5 refused to write over it. The person set the order in q-21: this
    pin, then T-27, then made-project-ci. Read the notes of rc.6, rc.7 and 7.0.0 (their Upgrading
    sections) and apply any step the branches' configs meet. On each of main, stack/go and go/cli,
    move the pin with itos pin 7.0.0 and the itos workflow action with it, go/cli's release.yml
    included, pinned by the release's commit, and regenerate the agent rules. Branches move
    independently; merge main down afterwards for the ledger, as earlier items did, keeping each
    branch's itos.yaml, ci.yml and registry. A gate 7.0.0 refuses on existing work is a finding, not
    a check to weaken. Push each branch's commits together and see its CI and Template check green.
- id: T-31
  type: ci
  title: A made project's CI runs its Go checks on its own main
  why: >
    A project made from the template and set up as T-27 says has its itos.yaml, but its CI still
    cannot prove its code on its own main. stack/go's and go/cli's ci.yml gate the ci job's setup-go
    step and the whole platform job on template branch names (stack/, go/, renovate/), so on a made
    main Go is never set up for the itos plan's Go steps and the Linux, macOS and Windows tests are
    skipped. Those conditions do nothing in the template: its main runs main's own root-only
    ci.yml, and these files only ever run on stack/go, go/cli and branches based on them. Remove
    the conditions from the setup-go step and the platform job on both branches, and keep the
    release job's own condition (a push to main) as it is. The comments that say a made main waits
    for made-project-ci change with the code they describe: ci.yml's and release.yml's in the ci
    commit, and TEMPLATE.md, docs/CLI.md, docs/upgrading.md and docs/ORCHESTRATING.md in a docs
    commit, saying what now runs and that a real release is still unproven (cli-releases). The
    workflow change lands on stack/go first and merges down into go/cli, each keeping its own
    itos.yaml and registry; main's ci.yml does not change. Prove it on a real made project's
    exact-head CI (q-22): render go + cli with itos-template v0.19.0 new from the public URL,
    answers name=go-template-itos-sample, owner=donvargax and
    module=github.com/donvargax/go-template-itos-sample, into the empty public repository
    donvargax/go-template-itos-sample; run the setup steps new prints with itos 7.0.0, answering
    init's offers no, make init's adoption commit, and push its main. That run's ci job and all
    three platform jobs must pass. The release job will run on that push: before pushing, run
    tools/bin/release-version in the made project to see whether it would release, since its first
    commits are chore commits; publishing a real release is cli-releases's proof (q-23), so if it
    would release, stop and report instead of pushing. The sample repository is kept afterwards, a
    pure render plus its setup, with no other commits (self-made-project). Template check stays
    green on every head. A made-project gate that fails on this push is a finding to report, not a
    check to weaken; doc-caps erroring but exiting 0 is doc-caps-render's.
- id: T-32
  type: docs
  title: Say in the made project's guides how its policy is adopted
  why: >
    Was made-project-setup-docs. T-27 gave a render itos-policy.yaml and the setup steps that adopt
    it, and T-31 made a made main's CI set up Go and run the platform tests, proved on
    go-template-itos-sample's run 38081894211. The guides a made project ships still say otherwise:
    docs/engineering.md on main says the template's gates must not be advertised as inherited until
    setup installs a policy, and docs/go.md's Made projects section on stack/go and go/cli says
    setup waits on upstream itos, links decision 2 (which renders leave out), and says the workflow
    runs its Go steps only on template branches. Its first paragraph also says the import-boundary
    self-test is not in the manifest's checks, which T-13 made false. The coordinator rewrites those
    passages in docs commits, main first and merged down, saying what setup adopts and what a made
    main's CI runs, and leaving the real release unclaimed, since cli-releases has not proved one.
    Wording the rest of these guides for the made project is guides-template-wording's.
- id: T-33
  type: ci
  title: A made CLI project publishes a real, attested release
  why: >
    Was cli-releases. T-20 built the release machinery on go/cli (release-version, release-notes,
    pinned git-cliff and GoReleaser, release.yml and ci.yml's release job), and T-31 made it live on
    a made project's main, but no made project has published with it: go-template-itos-sample's
    first push released nothing, its two commits being chore commits. q-23 put the real release
    here. q-24's docs-only fix could not pass the sample's own rules, which give every feat and fix
    a Scenarios footer naming the live scenarios it turns green, and q-25's flag change was already
    in the sample (T-14), so q-27 settled it: the template gains a small feat, version --json
    (T-34), and the sample takes that same change as one feat commit, literals replaced by the
    sample's answers, with the same Scenarios footer and Upgrading none, never marked breaking
    before v1 (q-26). A feat from 0.0.0 cuts v0.1.0. Beside it, a docs commit replaces the sample's
    stale docs/go.md Made projects section with go/cli's current text, literals replaced, so a later
    itos-template update meets identical text. Before pushing, run tools/bin/release-version as
    release.yml runs it and see it name v0.1.0. Push the sample's main with itos push; that run's ci
    job, three platform jobs and release job must pass, and the release must hold the five archives
    and checksums.txt GoReleaser makes. If a release step fails, fix its cause in the template on
    go/cli (a fix or ci commit, with its own red evidence where a scenario or test can show it),
    replay that same fix in the sample, and push again, until a release is published; never weaken
    or skip a step, and never delete a tag or release. Verify one archive with gh attestation
    verify against donvargax/go-template-itos-sample, unpack the Linux amd64 one and run its
    binary's version --json and count commands. Then the template's docs stop saying no made
    project has released: go/cli's docs/CLI.md, docs/upgrading.md, docs/ORCHESTRATING.md and
    TEMPLATE.md, in a docs commit naming the release and its run. The sample stays the template's
    render, its setup and replays of the template's own changes; change none of its settings.
  done_when:
    - run: "git ls-remote --tags https://github.com/donvargax/go-template-itos-sample.git | grep -q 'refs/tags/v'"
- id: T-34
  type: feat
  title: version --json prints the version and commit as one object
  why: >
    A small, additive feature for the example CLI on go/cli, chosen by the coordinator when the
    person asked for any small new feat (q-27) so that go-template-itos-sample can take it as its
    first release (T-33). Scripts that read a made project's version get it as JSON, as count
    already offers. version gains the --json switch (with its --no-json pair, given once like every
    switch, ID-CLI-08 and ID-CLI-09), and GO_TEMPLATE_ITOS_JSON turns it on as it does for count, so
    a shell that set it gets JSON from both commands. The object is one line on stdout:
    {"schema":1,"ok":true,"version":"<stamped version>","commit":"<stamped commit>"}, the commit key
    absent when the build has no commit, as the text form then has no second line. --version stays
    plain text: it is kong's flag, not the command, and gains no JSON. version's help names the JSON
    shape, as count's names its own. Scenarios, in features/cli.feature with IDs claimed through
    itos tests next-id, each tagged @T-34: version --json prints one object with the stamped version
    and commit; GO_TEMPLATE_ITOS_JSON turns version's JSON on; --no-json declines the JSON the
    environment turns on for version; version's help names its JSON shape. Red first: the steps and
    @wip scenarios in a test commit, then the feat, which is a plain feat with Upgrading none and no
    breaking mark, since no commit is marked breaking before v1 (q-26). Harvest from itos-template's
    version command if it already has a JSON form, rather than inventing a second shape. Keep the
    domain untouched: this is internal/cli and cmd only. The mutation proof and coverage gates of
    the branch hold.
  done_when:
    - run: test ! -d features || grep -q 'version --json' features/cli.feature
