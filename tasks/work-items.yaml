  - id: per-branch-ledgers
    title: Give each branch its own ledger file so a render's merge never conflicts there
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Every branch appends to tasks/phase-1.yaml, so the render's merge of the branches conflicts
      after a parent adds a task until the merge down lands (T-21, run 38021113542), and T-23
      re-runs the parents' Template check to clear that. With one ledger file per branch
      (ledger.files and its group, an id range or prefix per branch, decided with decision 4), no
      two branches append to the same file. Each branch also keeps its own tasks/work-items.yaml and
      plan, which can conflict the same way, so cover them too or confirm they cannot. When this
      lands and no render merge conflicts, remove T-23's rerun (q-10).

      T-24 showed the render merge also conflicts on shared docs each branch words its own way:
      stack/go run 38024177199 went red on docs/ORCHESTRATING.md and docs/go.md, with no ledger
      involved. Per-branch ledgers alone therefore do not retire T-23's rerun; it goes only once no
      render merge conflicts at all, which also needs those docs to stop diverging per branch or to
      merge cleanly. Ids are now minted by itos (decision 5), so the id-range part of this idea is
      moot.
  - id: renovate-proof
    title: Prove Renovate on a real request on every branch
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      T-25 landed the baseBranches configuration while Renovate had never run on this repository
      (q-12). Once Renovate runs, by the Mend app or a self-hosted action, check a real request on
      main, stack/go and go/cli: each judged by its own CI, automerged on green with the right type
      and trailer, and docs/upgrading.md updated to say the automation runs.

      Per q-20, Renovate keeps updating stack/go and go/cli separately. If their go.mod or go.sum
      land different versions, merging stack/go into go/cli conflicts and Template check's go + cli
      render goes red; the rerun job cannot clear that. Resolve it in a routine merge down, and
      revisit go/cli taking the stack's modules only by merge if it keeps happening.
