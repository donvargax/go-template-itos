  - id: cli-once-only-flags
    title: Reject repeated non-cumulative flags in the default CLI
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Belongs on go/cli. The person selected q-1: match itos-template by refusing each
      non-cumulative flag repeated with usage exit 2, including --json --no-json, while explicitly
      cumulative flags remain repeatable. Current ID-COUNT-06 specifies last-negation-wins, so
      specify new wip acceptance scenarios before implementation and update the incompatible live
      scenario only in the behavior-changing feat/fix commit. Harvest the existing flag-trace
      implementation from source internal/cli/flags.go rather than inventing a second parser. Cover
      identical and positive/negative repetitions, human and JSON usage results as the contract
      permits, preservation of -- and data arguments, and cumulative semantics only where the real
      CLI offers them. Commit failing steps first and confirm behavior failures, then build;
      describe the intentional upgrade change. No extra future flags or unrelated command behavior.

      Delivered on go/cli as T-14 (feat da0a56e, CI run 38015302591). Kept open as main's
      template-wide index entry.
  - id: cli-exhaustive-errors
    title: Lint the sealed CLI failure-to-exit classification exhaustively
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Belongs on go/cli, not main or a Go library stack with no process exits. Harvest the existing
      gochecksumtype gate and annotations from itos-template, using the linter already bundled in
      pinned golangci-lint rather than adding a custom analyzer or dependency. Annotate the existing
      sealed failure set and require its UI switch to name every variant; a default arm does not
      satisfy exhaustiveness and remains for genuinely unclassified errors. Preserve current exit
      codes, JSON envelopes and all live scenarios. Prove an omitted variant is refused by the
      actual configured linter using a compile-valid negative case, and prove the complete switch
      passes. This is a checked lint/refactor task, not a public behavior slice; keep it separate
      from duplicate flags and documentation. Obtain the persons approval of the reused linter when
      specifying this item, as the library-choice policy requires.

      Delivered on go/cli as T-17 with gochecksumtype, the person's choice in q-5 (CI run
      38016604269); T-18 named the lint in the guides and T-19 fixed the T-16 check it made stale.
      Kept open as main's template-wide index entry.
  - id: renovate-branches
    title: Renovate updates the branches that hold the code, not only main
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Moved from itos-template, where it was T-29; its why there assumed a separate itos branch,
      which ADR-0032 there dropped. Renovate works on the default branch, main, and reads its config
      from there. Main enables only github-actions and renovate-config and holds no go.mod, so the
      Go modules on stack/go and go/cli get no updates and nobody is told. Name the branches holding
      code in baseBranches (main, stack/go, go/cli): one pull request per base branch, each judged
      by that branch's own CI and automerged once it is green, so no workflow has to carry an update
      down. Each branch reads its own workflows and module, which differ, so weigh
      useBaseBranchConfig merge against one config on main enabling gomod. Group the requests for
      one dependency with a groupName so they move together; skew between branches is acceptable,
      since each branch's CI keeps it honest. Two strings are wrong for this layout: commitBody says
      an update lands on main, but most land on stack/go or go/cli; commitTrailers names Task: T-1,
      and itos verify in each branch's CI needs a task that branch's own ledger holds. Keep the
      owner presets, the pinned action digests, the cooldown and the automerge on green. A config
      proves nothing about the app being installed or the bot running (docs/upgrading.md), so verify
      on a real request.
  - id: pin-minted-ids
    title: Pin the first itos release that mints ids on the remote, and retire decision 4
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      itos decision 45 mints every item id from refs/itos/ids on the remote, shared by all branches,
      which ends the cross-branch task-id clash decision 4 works around by hand. It is itos
      slice-102, on itos main since 2026-10-09 but in no release; this repository pins 7.0.0-rc.1,
      whose task next-id reads only the local tree, and origin has no refs/itos ref. When a release
      ships it, pin it on every branch, and confirm before the first mint that the counter starts
      above the highest id on any branch (T-11 on go/cli when this was written), seeding it if itos
      supports that and reporting upstream if not. Then supersede decision 4 and remove the notes
      command it added.
