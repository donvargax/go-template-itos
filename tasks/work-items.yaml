# The work registry: who owns each phase and each piece of work, and what
# waits on what. itos work shows what can start; itos work check validates it.
# An item:
#
#   - id: T-2 # a task's ID, or a name of its own
#     title: What it is
#     phase: 1
#     owner: null # a handle, or null
#     status: todo # todo, doing, done or blocked
#     depends_on: []
phases:
  1: null # the ledger's phase 1, owned by nobody: a handle, or null
items:
  - id: T-1
    title: Bootstrap the language-neutral template root
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: task
  - id: T-2
    title: Build the Go foundation and its proof gates
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: task
  - id: T-3
    title: Build the public count CLI, its scenario runner and its release machinery
    phase: 1
    owner: donvargax
    status: done
    depends_on: [T-2]
    kind: task
  - id: count-cli
    title: go-template-itos counts the lines and words of a file or of standard input
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: slice
  - id: T-4
    title: Keep the template's itos data out of every render, and drop first_commit's footer
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: task
  - id: T-5
    title: The manifest declares what every render must pass, so check proves something
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: task
  - id: render-gofmt
    title: A render stays gofmt-clean after the literals are replaced
    phase: 1
    owner: null
    status: dropped
    depends_on: []
    kind: idea
  - id: T-6
    title: A rendered file is gofmt-clean whatever the substituted project name is
    phase: 1
    owner: donvargax
    status: doing
    depends_on: []
    kind: task
    why: >
      The first run of check over the checks T-5 declared found this.
      internal/release/releasetest/releasetest.go holds its fixture file names as the keys of one
      map literal, and two of those keys carry the project name: cmd/go-template-itos/main.go and
      its test. gofmt aligns the values of adjacent entries into a column sized by the longest key,
      so substituting a shorter name moves that column and every line in the block. The branch
      itself is gofmt-clean, so its own CI never sees this class of defect; only a render does,
      which is what the checks are for. Break the alignment group rather than chase a column, so the
      file is gofmt-clean at any name length: a blank line between composite-literal entries does
      it, verified on this shape, and gofmt then leaves each entry alone. Run gofmt after the edit,
      since the padding the old column left is then stale. Leave the checks alone: the manifest
      already declares the gofmt check and check already runs it, so a recurrence is caught without
      a new rule, and weakening it to make this green is not an option. Touching internal means the
      item owes the branch's code proof over cmd and internal, with fresh .metrics/mutate records,
      fail-uncovered and all-tests, and reshaping the fixture to hold no mutation site is not an
      option either.
