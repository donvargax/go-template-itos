  - id: feature-text-template-wording
    title: Feature descriptions speak to the made project
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Found reading T-40's go + cli render: go/cli's features/cli.feature describes 'The rules every
      command of a project made from this template follows' and features/count.feature 'What a
      person of a project made from this template observes', so a made project's scenarios still
      speak as the template. T-40 covered only the guides; the feature descriptions sit beside
      scenarios that the scenario-moves rule guards outside feat and fix, so rewording them needs
      its own decision on the commit type that may touch them.

      The person chose on 2026-10-10: reword each feature's description in the next real feat or fix
      that touches that file (features/cli.feature, features/count.feature). itos's moves rule
      refuses even a description-only change in a test commit ('a test commit changes the header or
      Background'), and a fix needs a Scenarios footer naming scenarios it turns green, which a
      wording change cannot honestly carry. itos was asked to let a docs or test commit change a
      feature's free-text description alone.
    deferred: >
      The person chose on 2026-10-10 that go/cli features/cli.feature and features/count.feature may
      keep describing themselves as the template for now. It waits until the person lifts it;
      itos#43 would let a docs or test commit reword a description alone.
