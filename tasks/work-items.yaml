      Solved in itos, checked 2026-10-10 at v7.4.0: tools/bin/previous-release (its T-071) checks
      the last release's tag out into a scratch worktree and runs that release's own scenarios
      against the new binary, ITOS_BIN naming it, as go test ./features; an old scenario that fails
      is accepted only when a commit since that release names it in a Changes footer, which its
      release-notes lists. go/cli's godog scenarios have the same shape, so harvest it with its
      provenance; itos's corpus and schema-contract halves have no counterpart here.
  - id: template-release-job
    title: The template's own releases are cut by a CI job
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Found cutting v0.1.0 on 2026-10-10: itos-template release made the tags locally and the person
      had to push them with /usr/bin/git, since itos's git shim refuses tag pushes (itos#37) and
      push.followtags makes a local tag on main a hazard. A workflow on main, run by hand or on a
      schedule, would check out every branch, run itos-template check and release, and push the tags
      atomically from CI, where no shim intercepts git; a release then needs no one's terminal.
  - id: go-module-releases
    title: A Go project without the command line gets versioned releases
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Found gathering the README's practices on 2026-10-10. Only go/cli has a release job; a project
      made from the go stack alone gets no version tags, so nothing marks its releases for go get or
      for its users. Give stack/go a release job that tags vX.Y.Z from the commits as go/cli's
      release-version decides, with notes from git-cliff and no binaries.

      itos's release.yml, checked 2026-10-10 at v7.4.0, releases a Go module: it refuses a version
      whose major the module path does not end in (/vN from v2, its T-089), since the module proxy
      would refuse that tag. A Go-only project's release job needs the same gate; harvest it with
      release-version.
  - id: cli-ctrl-c
    title: Ctrl-C cancels a command through its context
    phase: 1
    owner: null
    status: todo
    depends_on: [T-52]
    kind: idea
    why: >
      Decision 7's later slice. cmd/go-template-itos makes the context with signal.NotifyContext so
      an interrupt cancels it; the adapters act on a done context; and what a cancelled command
      prints and exits with (130 by convention, through internal/cli as every exit code is) is
      specified in scenarios first, red before green, on Linux, macOS and Windows, where an
      interrupt is delivered differently. Waits for T-52.
  - id: repo-settings-guide
    title: A made project's docs say which repository settings to turn on
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Found gathering the README's practices on 2026-10-10. Branch protection on main, the required
      checks (ci and the platform jobs), no force pushes, private vulnerability reporting,
      Dependabot alerts and secret scanning push protection are repository settings, not files, so a
      render cannot ship them. A short section in a made project's docs (docs/security.md or a setup
      guide) names each, why, and how to check it with gh, so a project made from the template gets
      the protection its CI assumes.
  - id: dependency-license-check
    title: CI checks that dependencies' licenses are allowed
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Found gathering the README's practices on 2026-10-10. docs/security.md and CONTRIBUTORS.md
      keep the licenses of copied code, but nothing checks the Go modules a project links: a new
      dependency under a license the project cannot ship would pass every gate. A pinned license
      checker (google/go-licenses or similar) over the module graph, with an allowlist in the
      project's own config, run in the Go stack's CI plan.
  - id: go-deps-age
    title: A Go module younger than a week is refused unless an exception names it
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Found in itos on 2026-10-10 (v7.4.0, tools/bin/deps-check, its T-067): it refuses a module of
      the build younger than seven days, by the module proxy's publication time, unless
      deps-check.json excepts it with a reason, an exception no longer needed failing too, and runs
      govulncheck only once every module has passed. The pre-commit hook runs it when go.mod or
      go.sum is staged and CI when a push's range changes them. Renovate's seven-day minimum release
      age covers only Renovate's own updates; a module added by hand here meets no such check.
      Harvest it into the Go stack's policy with its provenance.
