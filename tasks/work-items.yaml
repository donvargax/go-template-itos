    kind: idea
    why: >
      Found during T-52 on go/cli: cmd now binds the context, the UI and the count slice's Handler
      in kong and calls count's Run through kong's Context.Call, so Run is handed them by type. The
      version and completion commands are still called directly from run's switch, since version's
      Run takes three strings (the text, the version and the commit) that kong cannot tell apart by
