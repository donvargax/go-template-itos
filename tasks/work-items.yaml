  - id: itos-ci-workflows
    title: "Testing runs in tiers, fast local, judging CI, thorough nightly, as itos#41 lays out"
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      The person asked on 2026-10-10 that the template follow how itos's GitHub Actions workflows
      work, since itos moved slow checks out of a push's CI. Checked that day at itos v7.4.0: its
      ci.yml runs a push's plan by cost (static then late), the smoke scenarios and those the push's
      commits name, with a platform job on Linux, macOS and Windows that blocks the release job; a
      newer push replaces a waiting run, a running one finishes. Its nightly.yml, on a schedule and
      by hand, runs itos.yaml's ci.nightly: every scenario, the gates' self-tests and the slow steps
      a push leaves out (coverage runs, the release build for every platform), in a concurrency
      group of its own that never cancels a push's run; a red night opens or comments on one Nightly
      red issue and a green night closes it. go/cli copied the push half, cost tiers and smoke set
      included, but has no nightly, so a scenario no commit names never runs in CI, here or in a
      made project. Harvest the nightly and whatever else of itos's workflows a made project needs,
      with provenance; itos's tooling is changing, so re-read its .github/workflows, itos.yaml's ci
      section and tools/bin before specifying (docs/ORCHESTRATING.md). go-race-fuzz's fuzz budget
      and high-count rapid runs belong in that nightly.

      The person set it for v0.3.0 on 2026-10-10, after v0.2.0: projects that adopted v0.2.0 (itos,
      itos-cc, itos-template) take it with itos-template update. itos already has its own
      nightly.yml, the source of this design, so its update meets that file once and keeps its own.

      The person asked on 2026-10-10 that every go/cli follow itos#41's tiers, adapted to each
      branch, so this idea now holds them beside the nightly. Local, per item: mutation over each
      file's own unit tests first, scenarios only for a survivor and only those reaching its line,
      through itos-cc's mutation.tests (itos's itos-cc.yaml has the block, its list command being
      tools/bin/itos-cc-tests.ts, TypeScript, so the template needs a Go equivalent), instead of
      --all-tests; the item's scenarios and their neighbours. CI, per push: the code proof as today
      (no mutant runs), mutation sample --count 1 or 2 instead of 10, the smoke set and the
      scenarios the push names on Linux, macOS and Windows; today go/cli's platform jobs run go test
      ./... with every scenario. Nightly: sample --count 20 or a weekly full mutation run, every
      scenario on the three systems, go-race-fuzz's runs. stack/go has no scenarios, so its tiers
      are the unit tests, the proof, the sample and the nightly's high-count runs; go/cli adds the
      scenario selection. itos has not built it yet (p1-testing-tiers-guide and p1-ci-e2e-workflow,
      todo on 2026-10-10, itos#18 and #41): harvest what itos ships by then and re-read its tooling
      first. T-56 keeps itos-cc.yaml shippable for the mutation.tests block.
