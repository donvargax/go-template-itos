# The work registry: who owns each phase and each piece of work, and what
# waits on what. itos work shows what can start; itos work check validates it.
# An item:
#
#   - id: T-2 # a task's ID, or a name of its own
#     title: What it is
#     phase: 1
#     owner: null # a handle, or null
#     status: todo # todo, doing, done or blocked
#     depends_on: []
phases:
  1: null # the ledger's phase 1, owned by nobody: a handle, or null
items:
  - id: T-1
    title: Bootstrap the language-neutral template root
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: task
  - id: T-2
    title: Build the Go foundation and its proof gates
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: task
  - id: T-3
    title: Build the public count CLI, its scenario runner and its release machinery
    phase: 1
    owner: donvargax
    status: done
    depends_on: [T-2]
    kind: task
  - id: count-cli
    title: go-template-itos counts the lines and words of a file or of standard input
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: slice
  - id: T-4
    title: Keep the template's itos data out of every render, and drop first_commit's footer
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: task
  - id: T-5
    title: The manifest declares what every render must pass, so check proves something
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: task
  - id: render-gofmt
    title: A render stays gofmt-clean after the literals are replaced
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      check now runs the Go stack's gates in every render, and the go + cli combination fails the
      first of them: internal/release/releasetest/releasetest.go holds its fixture in one map
      literal, whose values gofmt aligns in a column, so replacing cmd/go-template-itos with a made
      project's name, which is shorter, moves every value in the block. The source is gofmt-clean,
      so this branch's own plan never sees it; only a render does, which is what the checks are for.
      Hold the fixture in a shape whose alignment cannot depend on a literal, a call per file or
      keys built from a constant, and prove it by rendering two answers of different lengths and
      running gofmt on each.
