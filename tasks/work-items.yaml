  - id: release-notes-render
    title: The go + cli render passes its release-notes tests
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      itos-template check at go/cli 366358c fails go + cli at go test ./... in
      tools/bin/release-notes: TestRender and TestMovedNotes expect the compare address as the
      literal https://github.com/itos-corp/go-template-itos/compare/..., which holds the module
      literal, so a render with module example.com/blue/fox expects
      https://example.com/blue/fox/compare/..., while main.go builds it from the repository literal
      itos-corp/go-template-itos and prints https://github.com/acme/blue-fox/compare/.... The go
      render passes. Found while building T-21, whose template-check workflow stays red on every
      branch until the go/cli tests name the address the way the code builds it, from the repository
      rather than the module.

      Delivered on go/cli as T-22: 0abcd23 builds the release-notes tests' expected addresses from
      repository, and 3fb0f90 links git-cliff's commits through the repository rather than the
      module literal. Its CI run
      https://github.com/donvargax/go-template-itos/actions/runs/38020818584 passed, and
      itos-template check v0.19.0 at that head printed 2 of 2 combinations passed.
