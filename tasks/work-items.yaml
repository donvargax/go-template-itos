# The work registry: who owns each phase and each piece of work, and what
# waits on what. itos work shows what can start; itos work check validates it.
# An item:
#
#   - id: T-2 # a task's ID, or a name of its own
#     title: What it is
#     phase: 1
#     owner: null # a handle, or null
#     status: todo # todo, doing, done or blocked
#     depends_on: []
phases:
  1: null # the ledger's phase 1, owned by nobody: a handle, or null
items:
  - id: T-1
    title: Bootstrap the language-neutral template root
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: task
  - id: T-2
    title: Build the Go foundation and its proof gates
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: task
  - id: T-3
    title: Build the public count CLI, its scenario runner and its release machinery
    phase: 1
    owner: donvargax
    status: done
    depends_on: [T-2]
    kind: task
  - id: count-cli
    title: go-template-itos counts the lines and words of a file or of standard input
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
