  - id: cli-releases
    title: Complete the generated CLI binary release pipeline
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Belongs on go/cli, not the Go library stack or language-neutral root. Harvest the proven
      generic version and notes helpers, release tests and checksum-pinned git-cliff from
      donvargax/itos-template, retaining license notices and real publishing identity. The existing
      reusable workflow references missing tools/bin/release-version and release-notes and has no
      caller; complete the caller after actual CI/platform checks pass. Keep generated-project
      binary releases distinct from template branch/tag releases, and never publish a nonexistent
      root binary. Preserve GoReleaser checksums and attestation, prove the wiring on a generated
      main, and make docs say what runs rather than what the dormant scaffold promises.
  - id: T-19
    title: Fix T-16's check that T-17 made stale
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: task
    why: >
      Was cli-guide-check-stale.
      T-16's second done_when check greps docs/CLI.md for cli-exhaustive-errors, the not-yet
      sentence of rule 32 naming the item that would add the exhaustive error lint. T-17 added that
      lint and, as its spec required, removed the sentence, so itos task T-16 now reports T-16
      failing though its work is done and nothing regressed. No gate runs it today, since CI runs
      only the checks of the tasks a push names, but a later push naming T-16 would go red. The
      ledger's T-16 check should stop requiring a sentence that described an interim state.
  - id: T-18
    title: Say in the guides that a lint holds every sealed failure set
    phase: 1
    owner: donvargax
    status: doing
    depends_on: []
    kind: task
    why: >
      Was go-guide-sumtype.
      T-17 enabled gochecksumtype on go/cli and annotated port.ReadFailure with //sumtype:decl,
      proven in the architecture self-test. docs/go.md's quality checks still list golangci-lint as
      the standard linters plus depguard, gosec and revive, and its steps for adding a package say
      nothing of annotating a new sealed failure set or giving it one exhaustive switch in
      internal/cli, so a set added without the annotation would go unchecked silently. The guide
      should say both, as the CLI feature's stage now behaves.
