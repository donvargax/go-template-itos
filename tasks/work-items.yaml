# The work registry: who owns each phase and each piece of work, and what
# waits on what. itos work shows what can start; itos work check validates it.
# An item:
#
#   - id: T-2 # a task's ID, or a name of its own
#     title: What it is
#     phase: 1
#     owner: null # a handle, or null
#     status: todo # todo, doing, done or blocked
#     depends_on: []
phases:
  1: null # the ledger's phase 1, owned by nobody: a handle, or null
items:
  - id: T-1
    title: Bootstrap the language-neutral template root
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: task
  - id: T-4
    title: Keep the template's itos data out of every render, and drop first_commit's footer
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: task
  - id: T-5
    title: The manifest declares what every render must pass, so check proves something
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: task
  - id: T-7
    title: Prove the first template end to end and say it is ready
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: task
    why: >
      The umbrella first-template, and the closing claim no earlier item makes because it was not
      true yet: that a project made from this template is a working project, and that the template
      may be advertised as ready. PLAN.md's order of work says it is advertised as ready only after
      the template-check piece passes, so this is where that happens and nowhere else. Three things
      have to hold, and one run proves all of them. The public template renders every combination
      its manifest allows and each render passes the checks the manifest names, with the credential
      scan marked so no warning is left. A project made from the public template builds, vets and
      tests, runs its own command, carries none of this repository's itos data, and has a first
      commit that names no task. And this repository's own documents stop claiming the template is
      unfinished, because after this it is not: the README status, PLAN.md's order of work and the
      sentence in docs/security.md that said no render credential scan was installed. Do not
      re-render itos-container here and do not treat it as a deliverable; it was a working sample
      taken while the manifest was still incomplete. The check builds this repository's generator
      from its public source and proves the template against the public URL, so it proves what a
      person can actually get rather than a local copy.
