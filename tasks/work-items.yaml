  - id: go-architecture
    title: Enforce the Go domain, ports, adapter and fake-test boundaries
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Belongs on stack/go, then merges downward into go/cli. Harvest the existing depguard rules
      from donvargax/itos-template, adapting the target module and count layout. Domain and ports
      must not import UI, command or concrete adapters; production domain code performs no
      OS/network I/O. Adapters depend on project ports, with fake-backed tests allowed to use
      porttest. Ban the existing source mock-library families, preserve Rapid placement, and keep UI
      libraries out of lower layers. Prove permitted and forbidden imports with compile-valid
      fixtures against the real pinned linter, not just grep checks. Root main gets no Go analyzer
      or Go gate. CLI-only error exhaustiveness and command rules are separate. Configure the Go
      self-test in the Go branch CI; root manifest declarations are a separate root-owned
      integration change.

      Delivered on stack/go as T-9 (CI run 37983078990), extended on go/cli by T-11 with the
      application and kong rules, and run in every Go render since T-13. Kept open as main's
      template-wide index entry.
  - id: go-engineering
    title: Document the reusable Go design and quality contract
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Belongs on stack/go and merges into go/cli, building on root docs/engineering.md rather than
      duplicating it. Explain the actual package layout, ports/fakes, property tests, OS handling,
      locked dependencies, checksum-pinned tools, lint/SAST/vulnerability checks, domain coverage
      and changed-code mutation proof. Distinguish proof at work-item closure from CI mutation
      sampling, and active checks from plans. Keep Go-specific commands out of the base guide,
      remove stale bootstrap claims on this branch, and preserve all gates. The template branch and
      emitted project must be discussed separately until emitted-project setup and CI are verified.

      Delivered on stack/go as T-10 (docs/go.md, CI run 38010453331) and merged into go/cli by T-11.
      Kept open as main's template-wide index entry.
  - id: cli-contract
    title: Document the reusable CLI contract on go/cli
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Belongs on go/cli only. Adapt the general contract from donvargax/itos-template/docs/CLI.md,
      not generator commands or domain types: output channels, stable machine fields and exit kinds,
      schema-1 JSON successes and failures, help, flags/environment/negation, argument separators,
      quiet structured logging, version/commit and four-shell completion. Preserve the current
      working features rather than adding unused abstractions. Sealed failure classification is
      present but not lint-enforced; consider the source gochecksumtype approach with the person
      before introducing its gate and annotations. Duplicate flags require an explicit decision
      because ID-COUNT-06 currently accepts --json --no-json while the source rejects repeated
      once-only flags. Behavior changes need coordinator-authored wip scenarios and red-first
      implementation, not a docs or lint task disguised as a fix. Reconcile non-domain unit tests
      with the agreed scenario/testing policy before removing tests. Correct CLI-branch bootstrap
      documentation without claiming dormant releases run.

      Split before implementation: this item now owns documentation only. Exhaustive error linting
      is cli-exhaustive-errors; the q-1 behavior change is cli-once-only-flags. Describe the current
      behavior accurately and identify the selected change as pending until its slice lands. Do not
      change live scenarios, flags or error classification in the documentation item.

      Delivered on go/cli as T-16, docs/CLI.md (CI run 38015944815). Kept open as main's
      template-wide index entry.
  - id: T-27
    title: A made project adopts the template's quality policy at setup
    phase: 1
    owner: donvargax
    status: doing
    depends_on: []
    kind: task
    why: >
      Was made-project-policy.
      Split by branch before implementation: language-independent policy source and setup
      declaration on main, Go gates/proof/test selection on stack/go, CLI scenario and command
      policy on go/cli. The manifest correctly excludes template itos.yaml and tasks; do not restore
      template history or copy mutation caches into renders. itos init produces only a generic
      starter, not the template custom gates. Decide with the person how fresh setup receives
      reusable policy through supported tooling, retaining the generator boundary that it knows no
      itos. Coordinate with source itos-template items new-steps and new-itos-setup, which are not
      implemented yet. Prove a fresh generated project has its own adoption/work history and the
      selected branches quality rules, and that running setup does not silently weaken CI or
      regenerate rules from a weaker starter. Any missing itos capability is reported upstream
      rather than worked around here.
  - id: made-project-ci
    title: Run the inherited Go and CLI checks on a generated ordinary main branch
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Belongs on stack/go for Go CI, with CLI scenario additions on go/cli. Keep root main
      language-neutral. Current Go workflows condition Go setup and platform jobs on template branch
      names, so ordinary generated main skips them. Each emitted workflow must exercise the code it
      carries without needing the template branch names; retain Linux/macOS/Windows tests,
      dependency checks, lint, vulnerability checks, coverage and mutation sampling. Coordinate with
      made-project-policy for configured itos gates rather than treating template render checks as
      emitted-project CI. Verify actual generated-project workflow behavior and exact-head CI, not
      only YAML strings or template-branch green runs. Common manifest declarations land on root
      main and merge downward separately.

      Since T-20 this also owns proving a real binary release on a generated main: the release job
      needs the ci and platform jobs, which a made main does not run yet (q-6).
  - id: cli-releases
    title: Complete the generated CLI binary release pipeline
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Belongs on go/cli, not the Go library stack or language-neutral root. Harvest the proven
      generic version and notes helpers, release tests and checksum-pinned git-cliff from
      donvargax/itos-template, retaining license notices and real publishing identity. The existing
      reusable workflow references missing tools/bin/release-version and release-notes and has no
      caller; complete the caller after actual CI/platform checks pass. Keep generated-project
      binary releases distinct from template branch/tag releases, and never publish a nonexistent
      root binary. Preserve GoReleaser checksums and attestation, prove the wiring on a generated
      main, and make docs say what runs rather than what the dormant scaffold promises.

      Delivered on go/cli as T-20 (CI run 38019557469): helpers, git-cliff pin and the release job,
      dormant on the template. A real release on a generated main waits for made-project-ci (q-6).
      Kept open as main's template-wide index entry.
  - id: cli-once-only-flags
    title: Reject repeated non-cumulative flags in the default CLI
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Belongs on go/cli. The person selected q-1: match itos-template by refusing each
      non-cumulative flag repeated with usage exit 2, including --json --no-json, while explicitly
      cumulative flags remain repeatable. Current ID-COUNT-06 specifies last-negation-wins, so
      specify new wip acceptance scenarios before implementation and update the incompatible live
      scenario only in the behavior-changing feat/fix commit. Harvest the existing flag-trace
      implementation from source internal/cli/flags.go rather than inventing a second parser. Cover
      identical and positive/negative repetitions, human and JSON usage results as the contract
      permits, preservation of -- and data arguments, and cumulative semantics only where the real
      CLI offers them. Commit failing steps first and confirm behavior failures, then build;
      describe the intentional upgrade change. No extra future flags or unrelated command behavior.

      Delivered on go/cli as T-14 (feat da0a56e, CI run 38015302591). Kept open as main's
      template-wide index entry.
  - id: cli-exhaustive-errors
    title: Lint the sealed CLI failure-to-exit classification exhaustively
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Belongs on go/cli, not main or a Go library stack with no process exits. Harvest the existing
      gochecksumtype gate and annotations from itos-template, using the linter already bundled in
      pinned golangci-lint rather than adding a custom analyzer or dependency. Annotate the existing
      sealed failure set and require its UI switch to name every variant; a default arm does not
      satisfy exhaustiveness and remains for genuinely unclassified errors. Preserve current exit
      codes, JSON envelopes and all live scenarios. Prove an omitted variant is refused by the
      actual configured linter using a compile-valid negative case, and prove the complete switch
      passes. This is a checked lint/refactor task, not a public behavior slice; keep it separate
      from duplicate flags and documentation. Obtain the persons approval of the reused linter when
      specifying this item, as the library-choice policy requires.

      Delivered on go/cli as T-17 with gochecksumtype, the person's choice in q-5 (CI run
      38016604269); T-18 named the lint in the guides and T-19 fixed the T-16 check it made stale.
      Kept open as main's template-wide index entry.
