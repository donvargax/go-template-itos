  - id: made-project-policy
    title: Give generated projects fresh governance with the inherited quality policy
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Branch-local integration index for the root made-project-policy idea. Common reusable policy
      belongs on main, Go additions on stack/go and CLI additions on go/cli; no live template task
      history or mutation cache is copied. Upstream itos has no supported initialization from
      reusable policy that also creates fresh project work data. Plain init writes only generic
      policy; supplied existing config is diagnosed rather than bootstrapped. Keep automatic
      inheritance blocked on a person-approved supported initialization design, not a custom
      workaround; the generator remains unaware of itos. Source new-steps/new-itos-setup are also
      prerequisites. The policy decision is being drafted while T-9 owns the checkout.

      The person selected upstream support rather than a custom workaround. Filed donvargax/itos#33
      after reproducing generic-starter and existing-policy diagnostic behavior on 7.0.0-rc.3 and
      checking releases/issues. Automatic quality-policy initialization waits for that supported
      upstream capability; independent template guidance, Go enforcement, CI and release work
      continue. The report evidence is tasks/upstream-policy-init-report.md.
    refs: [https://github.com/donvargax/itos/issues/33]
  - id: config-guidelines
    title: Carry shared configuration-format guidance on the base template
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      User asked for docs/CLI.md and docs/CONFIG.md in the generated CLI. CLI.md is already
      cli-contract on go/cli. Source docs/CONFIG.md is primarily language- and interface-independent
      application-format policy, so implementation belongs on main and merges downward into stack/go
      and go/cli; every generated CLI will inherit it without withholding generic config practices
      from other interfaces. Harvest only general rules from donvargax/itos-template/docs/CONFIG.md:
      explicit visible defaults, plain JSON data with YAML spelling when that format is selected,
      strict unknown/duplicate-key and unsafe-feature rejection, whole-input validation, key-path
      diagnostics, versioned compatibility, consistent shape, secret handling, format documentation
      and schemas. Remove manifests/render records, generator task IDs and historical ADR
      references. Distinguish desired policy from an implemented loader/schema/defaults command. Do
      not impose these conventions on third-party tool-owned formats. No new runtime config file or
      parser is introduced by the doc task. CLI flag/environment/precedence and current supported
      options belong on go/cli, which may add interface-specific sections or links, without
      duplicating common policy. This is a branch-local integration index; the actual documentation
      task must be specified on root main.

      Delivered on main as T-15, docs/CONFIG.md (CI run 38015304113), merged here in 8daac4c. Left
      open like main's index copies; nothing remains to do on this branch.
