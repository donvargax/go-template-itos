  - id: release-notes-render
    title: The go + cli render passes its release-notes tests
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      itos-template check at go/cli 366358c fails go + cli at go test ./... in
      tools/bin/release-notes: TestRender and TestMovedNotes expect the compare address as the
      literal https://github.com/itos-corp/go-template-itos/compare/..., which holds the module
      literal, so a render with module example.com/blue/fox expects
      https://example.com/blue/fox/compare/..., while main.go builds it from the repository literal
      itos-corp/go-template-itos and prints https://github.com/acme/blue-fox/compare/.... The go
      render passes. Found while building T-21, whose template-check workflow stays red on every
      branch until the go/cli tests name the address the way the code builds it, from the repository
      rather than the module.

      Delivered on go/cli as T-22: 0abcd23 builds the release-notes tests' expected addresses from
      repository, and 3fb0f90 links git-cliff's commits through the repository rather than the
      module literal. Its CI run
      https://github.com/donvargax/go-template-itos/actions/runs/38020818584 passed, and
      itos-template check v0.19.0 at that head printed 2 of 2 combinations passed.
  - id: T-23
    title: A passing Template check clears the parents' stale red runs
    phase: 1
    owner: donvargax
    status: doing
    depends_on: []
    kind: task
    why: >
      Was template-check-rerun.
      itos-template check renders go + cli by merging go/cli into stack/go, and refuses the render
      when that merge conflicts. Each branch appends to tasks/phase-1.yaml, so a push to main or
      stack/go that adds a ledger entry leaves the template-check run of its head red until the
      merge down reaches go/cli, and nothing runs it again: during T-21, stack/go run 38021113542
      failed with a ledger conflict and passed only on a manual rerun after go/cli took the merge.
      Decide whether a push to a child branch should also re-run the check for its parents, the
      weekly run is enough, or the coordinator re-runs it by hand after each merge down, and write
      that down.
  - id: per-branch-ledgers
    title: Give each branch its own ledger file so a render's merge never conflicts there
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Every branch appends to tasks/phase-1.yaml, so the render's merge of the branches conflicts
      after a parent adds a task until the merge down lands (T-21, run 38021113542), and T-23
      re-runs the parents' Template check to clear that. With one ledger file per branch
      (ledger.files and its group, an id range or prefix per branch, decided with decision 4), no
      two branches append to the same file. Each branch also keeps its own tasks/work-items.yaml and
      plan, which can conflict the same way, so cover them too or confirm they cannot. When this
      lands and no render merge conflicts, remove T-23's rerun (q-10).
