# The work registry: who owns each phase and each piece of work, and what
# waits on what. itos work shows what can start; itos work check validates it.
# An item:
#
#   - id: T-2 # a task's ID, or a name of its own
#     title: What it is
#     phase: 1
#     owner: null # a handle, or null
#     status: todo # todo, doing, done or blocked
#     depends_on: []
phases:
  1: null # the ledger's phase 1, owned by nobody: a handle, or null
items:
  - id: T-1
    title: Bootstrap the language-neutral template root
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: task
  - id: T-2
    title: Build the Go foundation and its proof gates
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: task
  - id: T-4
    title: Keep the template's itos data out of every render, and drop first_commit's footer
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: task
  - id: T-5
    title: The manifest declares what every render must pass, so check proves something
    phase: 1
    owner: donvargax
    status: doing
    depends_on: []
    kind: task
    why: >
      check runs and passes today and proves nothing: the manifest names no checks, so every
      combination renders and has nothing to run, and its only output is the warning that no check
      is marked as scanning the renders for credentials. Declare the checks beside what they check,
      per branch as docs/manifest.md says: the root's, stack/go's own, the cli feature's own, and a
      combination running the root's then the stack's then the features' in order. What each branch
      already runs in its CI is what its renders must pass, so a render is proved as strongly as the
      branch it came from. Checks run with no shell, so the gofmt pipeline is written as [sh, -c, …]
      and every other is a plain word list, each word's literals replaced by the answers as a file's
      contents are. No check is an itos one: after T-4 a render carries none of this repository's
      itos data, so itos config check and the like would have nothing to read, and the made
      project's own setup comes from the template's declared setup steps per ADR-0031. Pin gitleaks
      the way tools/bin/pinned pins the others, at a version and its release's own checksum, and
      mark it scans: [credentials] as the root's check, so every render is scanned and check stops
      warning. itos-template scans no render itself and knows no tool that does: the template names
      its own. The pin lands on the Go stack with the other tools itos.yaml's plan runs, never on
      the root, which has no toolchain; the manifest is one file on the root and merges down, so
      every render of a stack already carries the tool the root's check runs.
  - id: T-9
    title: Enforce the Go domain, ports, adapter and mock-free test boundaries
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: task
    why: >
      Implement only on stack/go. The root shared policy is docs/engineering.md; language-specific
      enforcement belongs beside its Go code and will merge downward into go/cli after exact-head
      CI, never upward into main. Harvest the existing depguard approach from
      donvargax/itos-template/.golangci.yml, adapting the real target module and layout. Domain and
      ports, including tests, must not import the application/command layer or concrete disk/input
      adapters. Production domain and ports perform no OS/network I/O; tests may read fixtures.
      Production adapters may import project ports but no project domain/application or other
      adapter implementations; adapter tests may use porttest fakes. Ban the five source
      mock-library families in every package/test and preserve Rapid-only-in-domain-tests and all
      existing lint/SAST/coverage/proof gates. Add a small architecture-check self-test driven by
      the actual checksum-pinned golangci-lint and this branch actual configuration, with
      compile-valid isolated positive/negative fixtures, local stubs where needed rather than new
      third-party dependencies, and no custom analyzer or copied generator package names. A negative
      case must fail for its intended depguard violation, not invalid Go/import cycles/loading
      errors; positive port/fake imports and fixture I/O in tests must pass. Commit the self-test
      first as a test commit and see it expose the missing rules before adding enforcement; hooks
      run the configured checks, and the task implementation commits are pushed together only once
      the checks pass. Install this self-test in stack/go CI, with checks preserving
      Windows/macOS/Linux portability; do not change a public interface, CLI scenario, root
      manifest, or CLI-only Kong/exit-type rules. Root manifest registration and CLI integration
      adjustments get separate items. If any existing test contradicts the agreed boundary, stop
      with evidence rather than deleting coverage or broadening the rule. Source harvest provenance
      and MIT permission remain as documented.
