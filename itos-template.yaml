version: 5

# The root's checks, run in every render first, then the stack's, then the
# features' (docs/manifest.md). A check is a list of words and no shell runs
# it, so the gofmt pipeline writes one itself, and each word's literals are
# replaced by the answers as a file's contents are. None is an itos one: a
# render carries none of this repository's own itos data (template_only below),
# so itos config check and the like would have nothing to read.
checks:
  # The credential scan every render passes first, pinned as the other tools
  # are in tools/bin/pinned. Marking it is what tells itos-template check that
  # the template scans its renders for credentials, so it stops warning.
  - {run: [tools/bin/pinned, gitleaks, dir, ., --redact], scans: [credentials]}

# Each stack's and feature's list is the plan its branch's itos.yaml runs, less
# its itos commands. tools/bin/architecture-check follows golangci-lint, as it
# does there: it runs go test over fixtures the pinned linter must refuse or
# allow, so a render proves its import boundaries still catch what they should,
# not only that its own code passes them.
stacks:
  - name: go
    # What new prints for the person to run in the made project, never running it
    # (decision 2): itos adopts the branch's itos-policy.yaml as the project's own
    # itos.yaml, with a fresh ledger and registry (q-13), and asks its offers then;
    # the file is removed after, so the project has one config. The steps sit on
    # the stack, so a go + cli render prints them once, adopting go/cli's file.
    setup:
      - [itos, init, --policy, itos-policy.yaml]
      - [rm, itos-policy.yaml]
    checks:
      - [sh, -c, "! gofmt -l internal | grep ."]
      - [go, build, ./...]
      - [go, vet, ./...]
      - [go, mod, verify]
      - [go, mod, tidy, -diff]
      - [tools/bin/pinned, golangci-lint, run, ./...]
      - [tools/bin/architecture-check]
      - [go, tool, govulncheck, -test, ./...]
      - [go, test, ./...]
      - [tools/bin/domain-coverage]
      - [tools/bin/pinned, itos-cc, mutation, sample, --count, 10]

features:
  - name: cli
    stack: go
    checks:
      - [sh, -c, "! gofmt -l cmd internal features | grep ."]
      - [go, build, ./...]
      - [go, vet, ./...]
      - [go, mod, verify]
      - [go, mod, tidy, -diff]
      - [tools/bin/pinned, golangci-lint, run, ./...]
      - [tools/bin/architecture-check]
      - [go, tool, govulncheck, -test, ./...]
      - [go, test, ./cmd/..., ./internal/...]
      - [tools/bin/domain-coverage]
      - [go, test, ./features, -count=1]
      - [tools/bin/pinned, itos-cc, mutation, sample, --count, 10]

questions:
  - name: name
    literal: go-template-itos
    question: What is the project's name?
    pattern: "[a-z][a-z0-9]*(-[a-z0-9]+)*"
    case_forms: true
  - name: owner
    literal: itos-corp
    question: What owner should appear in the project's attribution?
    pattern: "[a-z][a-z0-9]*(?:-[a-z0-9]+)*"
  - name: module
    literal: github.com/itos-corp/go-template-itos
    question: What is the Go module path?
    pattern: "[a-z0-9.-]+(/[a-z0-9._-]+)+"

template_only:
  - itos.yaml
  - tasks
  # Re-proves this template's renders; a made project has no renders to prove.
  - .github/workflows/template-check.yml
  # The template's plan, its coordination notes and the guidance for working on
  # it as a template (q-17): a made project has no branches to merge down, no
  # renders to prove and no coordinator's notes of this repository's, so its
  # README.md and AGENTS.md speak to it alone and these stay here.
  - PLAN.md
  - docs/ORCHESTRATING.md
  - TEMPLATE.md
  # Compares itos-policy.yaml with this repository's itos.yaml (q-14); a made
  # project has neither the template's itos.yaml nor, after setup, the policy.
  # itos-policy.yaml itself ships: the setup steps read it, then remove it.
  - tools/bin/policy-drift
  # The decisions about running the template, and the index itos writes from
  # every record in the folder (q-19): a render ships decision 1 alone, the one
  # binding a made CLI, and itos writes the made project's own index, naming 1
  # beside it, when the project records its first decision. A later decision
  # binding made projects stays off this list; one about the template joins it.
  - docs/decisions/0002-made-projects-inherit-quality-policy-through-upstream-itos-initialization.md
  - docs/decisions/0003-every-question-is-asked-and-recorded-on-main.md
  - docs/decisions/0004-a-new-task-id-is-one-above-the-highest-on-any-branch.md
  - docs/decisions/0005-item-ids-are-minted-by-itos-from-refs-itos-ids.md
  - docs/decisions/README.md

first_commit: |-
  chore: start the generated project
