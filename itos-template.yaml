version: 5

# The root's checks, run in every render first, then the stack's, then the
# features' (docs/manifest.md). A check is a list of words and no shell runs
# it, so the gofmt pipeline writes one itself, and each word's literals are
# replaced by the answers as a file's contents are. None is an itos one: a
# render carries none of this repository's own itos data (template_only below),
# so itos config check and the like would have nothing to read.
checks:
  # The credential scan every render passes first, pinned as the other tools
  # are in tools/bin/pinned. Marking it is what tells itos-template check that
  # the template scans its renders for credentials, so it stops warning.
  - {run: [tools/bin/pinned, gitleaks, dir, ., --redact], scans: [credentials]}

# Each stack's and feature's list is the plan its branch's itos.yaml runs, less
# its itos commands. tools/bin/architecture-check follows golangci-lint, as it
# does there: it runs go test over fixtures the pinned linter must refuse or
# allow, so a render proves its import boundaries still catch what they should,
# not only that its own code passes them.
stacks:
  - name: go
    # What new prints for the person to run in the made project, never running it. The mv
    # gives the project its license (the template's decision 9): the template's LICENSE is the
    # AGPL and stays here, and LICENSE.project, the MIT text naming the owner
    # answered, becomes the project's LICENSE. It is the only step, since a made project needs
    # no itos (decision 10) and keeps no itos.yaml, itos-policy.yaml or registry. It stands in
    # until itos-template#8 lets the manifest render a file at another path; an update follows
    # the rename (itos-template#2), which for a license text is what a made project wants.
    setup:
      - [mv, LICENSE.project, LICENSE]
    checks:
      - [sh, -c, "! gofmt -l internal | grep ."]
      - [go, build, ./...]
      - [go, vet, ./...]
      - [go, mod, verify]
      - [go, mod, tidy, -diff]
      - [tools/bin/pinned, golangci-lint, run, ./...]
      - [tools/bin/architecture-check]
      - [go, tool, actionlint]
      - [tools/bin/govulncheck]
      - [go, test, ./...]
      - [tools/bin/domain-coverage]
      - [tools/bin/pre-commit-check]
      - [go, run, ./tools/bin/pre-push-check]
      - [tools/bin/pinned, itos-cc, mutation, run, --count, 10, internal]

features:
  - name: cli
    stack: go
    checks:
      - [sh, -c, "! gofmt -l cmd internal features | grep ."]
      - [go, build, ./...]
      - [go, vet, ./...]
      - [go, mod, verify]
      - [go, mod, tidy, -diff]
      - [go, run, ./tools/bin/notices, -check]
      - [tools/bin/pinned, golangci-lint, run, ./...]
      - [tools/bin/architecture-check]
      - [go, tool, actionlint]
      - [tools/bin/govulncheck]
      - [go, test, ./cmd/..., ./internal/...]
      - [tools/bin/domain-coverage]
      # The binary driver runs only where its variable is set (decision 14); the word is
      # replaced by the answers like any other.
      - [env, GO_TEMPLATE_ITOS_FEATURES_BINARY_DRIVER=1, go, test, ./features, -count=1]
      - [tools/bin/pinned, itos-cc, mutation, run, --count, 10, --all-tests, cmd, internal]

questions:
  - name: name
    literal: go-template-itos
    question: What is the project's name?
    pattern: "[a-z][a-z0-9]*(-[a-z0-9]+)*"
    case_forms: true
  - name: owner
    literal: itos-corp
    question: What owner should appear in the project's attribution?
    pattern: "[a-z][a-z0-9]*(?:-[a-z0-9]+)*"
  - name: module
    literal: github.com/itos-corp/go-template-itos
    question: What is the Go module path?
    pattern: "[a-z0-9.-]+(/[a-z0-9._-]+)+"

template_only:
  - itos.yaml
  - tasks
  # The template's own license, the AGPL, and the section 7 permission that lets
  # a made project choose its terms (the template's decision 9): a render starts MIT with its
  # owner instead, from LICENSE.project, which the go stack's setup moves to
  # LICENSE.
  - LICENSE
  - LICENSE-EXCEPTION
  # Re-proves this template's renders; a made project has no renders to prove.
  - .github/workflows/template-check.yml
  # The template's own itos checks (commit shape, footers, ledger): a made project needs no
  # itos (decision 10), so its ci.yml is the only workflow it keeps and calls plain commands.
  - .github/workflows/itos.yml
  # Starts the Go branches' nightlies from main, the only branch GitHub schedules from (decision
  # 15); a made project's nightly.yml carries its own schedule.
  - .github/workflows/nightly-dispatch.yml
  # The template's plan, its coordination notes and the guidance for working on
  # it as a template (q-17): a made project has no branches to merge down, no
  # renders to prove and no coordinator's notes of this repository's, so its
  # README.md and AGENTS.md speak to it alone and these stay here.
  - PLAN.md
  - docs/ORCHESTRATING.md
  - TEMPLATE.md
  # The decisions about running the template, and the index itos writes from
  # every record in the folder (q-19): a render ships the records that bind a
  # made project (the template's decisions 1, 6, 7 and 8), indexed by its
  # docs/architecture/09-architecture-decisions.md, which replaces the index
  # itos writes. A later decision binding made projects stays off this list;
  # one about the template joins it.
  - docs/decisions/0002-made-projects-inherit-quality-policy-through-upstream-itos-initialization.md
  - docs/decisions/0003-every-question-is-asked-and-recorded-on-main.md
  - docs/decisions/0004-a-new-task-id-is-one-above-the-highest-on-any-branch.md
  - docs/decisions/0005-item-ids-are-minted-by-itos-from-refs-itos-ids.md
  # Decision 9 is about the template's own license, not one a made project
  # keeps: the project's license is the MIT text it starts with.
  - docs/decisions/0009-the-template-is-agpl-3-0-and-lets-made-projects-choose-their-license.md
  # Decision 10 is about how the template stopped shipping itos: a made project
  # has no decision 2 to compare it with, and itos is not something it keeps.
  - docs/decisions/0010-a-made-project-needs-no-itos-its-ci-hooks-and-docs-call-plain-commands.md
  - docs/decisions/README.md

first_commit: |-
  chore: start the generated project
