# Shared commit rules and checks. Stack branches add language gates with the
# code they prove; the root remains language-neutral.
version: 1

# The source project's pin and checksum, copied with its workflow action.
pin:
  version: "7.0.0-rc.1"
  checksums: "b4061c97aa46939e7dc289bf519c6a294d93aa476787d380794f33933c67122c" # SHA-256 of checksums.txt

ledger:
  files: "tasks/phase-{group}.yaml"
  id: "T-\\d+"

commits:
  types: [feat, fix, refactor, perf, test, build, ci, chore, docs, style, revert]
  header_lint: { use: builtin }
  footers:
    Task:
      source: ledger
      required_for: [refactor, perf, test, build, ci, chore, style, revert]
      validate_for: all
      read_at: commit
  scopes:
    docs: { only: ["**/*.md", "docs/**", "tasks/**"] }

hooks:
  bin: itos

ci:
  steps:
    - { run: itos config check, cost: static }
    - { run: tools/bin/doc-caps, cost: static }
    - run: >-
        test -f AGENTS.md && test -f CLAUDE.md && test -f CONTRIBUTORS.md &&
        test -f PLAN.md && test -f README.md && test -f docs/ORCHESTRATING.md &&
        test -f docs/architecture.md && test -f docs/security.md &&
        test -f docs/upgrading.md && test -f LICENSE && test -f .gitattributes &&
        test -f .gitignore && test -f .github/workflows/ci.yml &&
        test -f .github/renovate.json5 && test -x tools/bin/doc-caps
      cost: static
    - { run: "! gofmt -l internal | grep .", cost: static }
    - { run: go build ./..., cost: static }
    - { run: go vet ./..., cost: static }
    - { run: go mod verify, cost: static }
    - { run: go mod tidy -diff, cost: static }
    - { run: tools/bin/pinned golangci-lint run ./..., cost: static }
    - { run: go tool govulncheck -test ./..., cost: late }
    - { run: "RAPID_CHECKS=1 go test ./...", cost: late }
    - { run: tools/bin/domain-coverage, cost: late }
    - { run: tools/bin/pinned itos-cc mutation sample --count 10, cost: late }
  prose:
    paths: ["**/*.md", "docs/**", "tasks/**"]
    steps:
      - itos config check
      - tools/bin/doc-caps
      - >-
        test -f AGENTS.md && test -f CLAUDE.md && test -f CONTRIBUTORS.md &&
        test -f PLAN.md && test -f README.md && test -f docs/ORCHESTRATING.md &&
        test -f docs/architecture.md && test -f docs/security.md &&
        test -f docs/upgrading.md && test -f LICENSE && test -f .gitattributes &&
        test -f .gitignore && test -f .github/workflows/ci.yml &&
        test -f .github/renovate.json5 && test -x tools/bin/doc-caps
  watch: { provider: github }

proof:
  code:
    paths: ["internal/**/*.go"]
    check: "tools/bin/pinned itos-cc mutation check --since {base} --fail-uncovered --json internal"
