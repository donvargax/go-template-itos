version: "2"
linters:
  default: standard
  enable:
    - depguard
    - gosec
    - revive
  settings:
    depguard:
      rules:
        domain:
          files:
            - "**/internal/count/domain/**"
          deny:
            - pkg: os
              desc: "the domain reaches files through its port"
            - pkg: net
              desc: "the domain does no I/O"
        infra:
          list-mode: lax
          files:
            - "**/internal/count/disk/**"
          allow:
            - github.com/itos-corp/go-template-itos/internal/count/port$
          deny:
            - pkg: github.com/itos-corp/go-template-itos/internal/count/domain$
              desc: "infrastructure imports only the port it implements"
        rapid:
          files:
            - $all
            - "!**/internal/count/domain/*_test.go"
          deny:
            - pkg: pgregory.net/rapid
              desc: "rapid is used only by domain property tests"
    revive:
      rules:
        - name: file-length-limit
          arguments:
            - max: 600
              skipComments: true
              skipBlankLines: true
  exclusions:
    rules:
      - path: _test\.go$
        linters: [gosec]
formatters:
  enable:
    - gofmt
