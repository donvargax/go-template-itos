version: "2"
linters:
  default: standard
  enable:
    - depguard
    - forbidigo
    - gochecksumtype
    - gosec
    - nolintlint
    - revive
  settings:
    # forbidigo refuses identifiers, each pattern naming the decision it holds.
    # Patterns and comments are taken from
    # github.com/donvargax/itos-template/.golangci.yml with the owner's
    # permission (CONTRIBUTORS.md), each source cited as itos-template's own
    # decision, never as a number of this project's. analyze-types matches an
    # identifier by its package, not by the name a file imports it as, so an
    # alias does not slip past. A pattern holding only some files has its
    # exclusions below, each saying why.
    # Harvested from github.com/donvargax/itos-template/.golangci.yml with the
    # owner's permission (CONTRIBUTORS.md). The ports' failures are sealed
    # sets (//sumtype:decl), and internal/cli gives each kind its exit code in
    # one switch per set (docs/CLI.md rule 32): a switch that leaves a kind
    # out is refused, and a default case does not count as naming them.
    gochecksumtype:
      default-signifies-exhaustive: false
    forbidigo:
      analyze-types: true
      forbid:
        # itos-template's decision 26: code that differs by OS takes the OS as a
        # value, and only a thin caller reads runtime.GOOS. Every read is
        # refused, a comparison and a copy compared later alike; an edge that
        # hands the OS in as a value is excepted below, by name, when a project
        # has one. forbidigo rather than a ruleguard rule, which matches shapes
        # and misses the OS copied into a variable and compared later.
        - pattern: ^runtime\.GOOS$
          pkg: ^runtime$
          msg: "code that differs by OS takes the OS as a value (itos-template's decision 26): read the OS only at the edge that hands it in as a value"
        # itos-template's decision 17: the domain knows no UI, and output goes
        # through the writers the UI hands down, so it is tested and --json
        # keeps stdout to itself: nothing prints to the process's stdout behind
        # them.
        - pattern: ^(fmt\.Print(f|ln)?|print|println)$
          msg: "output goes through the writers the UI hands down (itos-template's decision 17): write to the io.Writer given"
        # itos-template's decision 17: the domain knows no UI, exit codes
        # included; a command returns its code and cmd alone exits with it
        # (its exclusion below). log.Fatal exits too.
        - pattern: ^(os|syscall)\.Exit$
          msg: "cmd alone exits (itos-template's decision 17): return the exit code to it"
        - pattern: ^log\.Fatal(f|ln)?$
          msg: "cmd alone exits (itos-template's decision 17): return the exit code to it"
        # itos-template's docs/CLI.md rule 31: a bug exits 70, as an error
        # nobody classified, never as a panic, which exits 2 with a trace.
        # Input is checked at its edge into a value its one constructor makes
        # and trusted after (itos-template's decision 41), so no inner code
        # meets a case it must panic on. Tests are left out (below).
        - pattern: ^panic$
          msg: "a bug exits 70, never as a panic (itos-template's docs/CLI.md rule 31): return an error, or take a value checked at its edge"
    # An exception is one finding, excepted on its line with the linter it
    # silences named and why; one that silences nothing is reported, so an
    # exception goes when its finding does. Taken from itos-template.
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    # Role rules taken from github.com/donvargax/itos-container/.golangci.yml
    # (its itos-cc ADR-0047/0051 and itos ADR-0053 rules), adapted to this
    # module's paths and decision 11. A shared domain is an engine,
    # internal/engine/<name>/{domain,port,port/porttest,<adapter>}. Go code
    # under internal that no role names is refused, and the domain and port
    # import only what their exact lists name. The graph check, tools/architecture
    # (tools/bin/architecture-check), resolves the owner and layer arrows that
    # depguard's import prefixes cannot express, and its fixtures prove these
    # rules refuse what they should. The template's own bans on mocks and
    # rapid follow.
    depguard:
      rules:
        unclassified:
          list-mode: strict
          files:
            - "**/internal/**"
            - "**/pkg/**"
            - "!**/internal/cli/**"
            - "!**/internal/version/**"
            - "!**/internal/release/**"
            - "!**/internal/slices/*/*/**"
            - "!**/internal/engine/*/*/**"
          allow:
            - "architecture.invalid/unclassified$"
        domain:
          list-mode: strict
          files:
            - "**/internal/slices/*/domain/**"
            - "**/internal/engine/*/domain/**"
            - "!$test"
          allow:
            - "bytes$"
            - "context$"
            - "errors$"
            - "fmt$"
            - "maps$"
            - "slices$"
            - "sort$"
            - "strconv$"
            - "strings$"
            - "time$"
            - "unicode$"
            - "github.com/itos-corp/go-template-itos/internal/slices/"
            - "github.com/itos-corp/go-template-itos/internal/engine/"
        domain-tests:
          list-mode: strict
          files:
            - "**/internal/slices/*/domain/*_test.go"
            - "**/internal/slices/*/domain/**/*_test.go"
            - "**/internal/engine/*/domain/*_test.go"
            - "**/internal/engine/*/domain/**/*_test.go"
          allow:
            - "$gostd"
            - "github.com/itos-corp/go-template-itos/internal/slices/"
            - "github.com/itos-corp/go-template-itos/internal/engine/"
            - "pgregory.net/rapid$"
        port:
          list-mode: strict
          files:
            - "**/internal/slices/*/port/**"
            - "**/internal/engine/*/port/**"
            - "!$test"
            - "!**/internal/slices/*/port/porttest/**"
            - "!**/internal/engine/*/port/porttest/**"
          allow:
            - "bytes$"
            - "context$"
            - "errors$"
            - "fmt$"
            - "maps$"
            - "slices$"
            - "sort$"
            - "strconv$"
            - "strings$"
            - "time$"
            - "unicode$"
            - "github.com/itos-corp/go-template-itos/internal/slices/"
            - "github.com/itos-corp/go-template-itos/internal/engine/"
        store-ports-io:
          # Adapted from itos ADR-0053 store-ports-io; tests may read fixtures.
          list-mode: lax
          files:
            - "**/internal/slices/*/port/**"
            - "**/internal/engine/*/port/**"
            - "!$test"
          deny:
            - pkg: "os"
              desc: "I/O belongs in an adapter behind a port; fakes keep their state in memory"
            - pkg: "net"
              desc: "I/O belongs in an adapter behind a port; fakes keep their state in memory"
            - pkg: "syscall"
              desc: "I/O belongs in an adapter behind a port; fakes keep their state in memory"
            - pkg: "golang.org/x/sys/"
              desc: "I/O belongs in an adapter behind a port; fakes keep their state in memory"
            - pkg: "io/ioutil$"
              desc: "I/O belongs in an adapter behind a port; fakes keep their state in memory"
            - pkg: "path/filepath$"
              desc: "I/O belongs in an adapter behind a port; fakes keep their state in memory"
            - pkg: "plugin$"
              desc: "I/O belongs in an adapter behind a port; fakes keep their state in memory"
        port-tests:
          list-mode: strict
          files:
            - "**/internal/slices/*/port/*_test.go"
            - "**/internal/slices/*/port/**/*_test.go"
            - "**/internal/engine/*/port/*_test.go"
            - "**/internal/engine/*/port/**/*_test.go"
          allow:
            - "$gostd"
            - "github.com/itos-corp/go-template-itos/internal/slices/"
            - "github.com/itos-corp/go-template-itos/internal/engine/"
        adapter:
          list-mode: lax
          files:
            - "**/internal/slices/*/*/**"
            - "**/internal/engine/*/*/**"
            - "!**/internal/slices/*/domain/**"
            - "!**/internal/slices/*/port/**"
            - "!**/internal/slices/*/command/**"
            - "!**/internal/engine/*/domain/**"
            - "!**/internal/engine/*/port/**"
          allow:
            - "github.com/itos-corp/go-template-itos/internal/slices/"
            - "github.com/itos-corp/go-template-itos/internal/engine/"
          deny:
            - pkg: "github.com/itos-corp/go-template-itos/"
              desc: "adapters import only their own engine's port, or other engines' APIs"
        porttest:
          list-mode: strict
          files:
            - "**/internal/slices/*/port/porttest/**"
            - "**/internal/engine/*/port/porttest/**"
          allow:
            - "$gostd"
            - "github.com/itos-corp/go-template-itos/internal/slices/"
            - "github.com/itos-corp/go-template-itos/internal/engine/"
        command:
          list-mode: strict
          files:
            - "**/internal/slices/*/command/**"
          allow:
            - "$gostd"
            - "github.com/alecthomas/kong$"
            - "github.com/itos-corp/go-template-itos/internal/cli$"
            - "github.com/itos-corp/go-template-itos/internal/slices/"
            - "github.com/itos-corp/go-template-itos/internal/engine/"
        command-io:
          # Adapted from itos ADR-0053 store-ports-io; tests may read fixtures.
          list-mode: lax
          files:
            - "**/internal/slices/*/command/**"
            - "!$test"
          deny:
            - pkg: "os"
              desc: "I/O belongs in an adapter behind a port; fakes keep their state in memory"
            - pkg: "net"
              desc: "I/O belongs in an adapter behind a port; fakes keep their state in memory"
            - pkg: "syscall"
              desc: "I/O belongs in an adapter behind a port; fakes keep their state in memory"
            - pkg: "golang.org/x/sys/"
              desc: "I/O belongs in an adapter behind a port; fakes keep their state in memory"
            - pkg: "io/ioutil$"
              desc: "I/O belongs in an adapter behind a port; fakes keep their state in memory"
            - pkg: "path/filepath$"
              desc: "I/O belongs in an adapter behind a port; fakes keep their state in memory"
            - pkg: "plugin$"
              desc: "I/O belongs in an adapter behind a port; fakes keep their state in memory"
        ui:
          list-mode: strict
          files:
            - "**/internal/cli/**"
            - "!$test"
          allow:
            - "$gostd"
            - "github.com/alecthomas/kong$"
            # temporary: cli classifies read failures until cli-contract-code moves that into the count slice, as itos-container does, and removes this arrow.
            - "github.com/itos-corp/go-template-itos/internal/engine/counting/port$"
        ui-tests:
          list-mode: strict
          files:
            - "**/internal/cli/*_test.go"
            - "**/internal/cli/**/*_test.go"
          allow:
            - "$gostd"
            - "github.com/itos-corp/go-template-itos/internal/cli$"
            - "github.com/itos-corp/go-template-itos/internal/cli/"
            - "github.com/alecthomas/kong$"
            # temporary: cli classifies read failures until cli-contract-code moves that into the count slice, as itos-container does, and removes this arrow.
            - "github.com/itos-corp/go-template-itos/internal/engine/counting/port$"
        version:
          list-mode: strict
          files:
            - "**/internal/version/**"
            - "!$test"
          allow:
            - "$gostd"
        version-tests:
          list-mode: strict
          files:
            - "**/internal/version/*_test.go"
            - "**/internal/version/**/*_test.go"
          allow:
            - "$gostd"
            - "github.com/itos-corp/go-template-itos/internal/version$"
            - "github.com/itos-corp/go-template-itos/internal/version/"
        release:
          list-mode: strict
          files:
            - "**/internal/release/**"
            - "!$test"
            - "!**/internal/release/releasetest/**"
          allow:
            - "$gostd"
            - "github.com/itos-corp/go-template-itos/internal/release$"
        release-tests:
          list-mode: strict
          files:
            - "**/internal/release/*_test.go"
            - "**/internal/release/**/*_test.go"
            - "**/internal/release/releasetest/**"
          allow:
            - "$gostd"
            - "github.com/itos-corp/go-template-itos/internal/release$"
            - "github.com/itos-corp/go-template-itos/internal/release/releasetest"
        # kong is the UI's, harvested from itos-template's kong rule: here the
        # UI is cmd, internal/cli and each slice's command package.
        kong:
          files:
            - $all
            - "!**/cmd/**"
            - "!**/internal/cli/**"
            - "!**/internal/slices/*/command/**"
          deny:
            - pkg: github.com/alecthomas/kong
              desc: "kong stays in the UI: cmd, internal/cli and a slice's command package; never loosen this one"
        mocks:
          files:
            - $all
          deny:
            - pkg: github.com/golang/mock
              desc: "no mocking library: write an in-memory fake or stub of the port in its porttest package, as internal/engine/counting/port/porttest does"
            - pkg: go.uber.org/mock
              desc: "no mocking library: write an in-memory fake or stub of the port in its porttest package, as internal/engine/counting/port/porttest does"
            - pkg: github.com/stretchr/testify/mock
              desc: "no mocking library: write an in-memory fake or stub of the port in its porttest package, as internal/engine/counting/port/porttest does"
            - pkg: github.com/vektra/mockery
              desc: "no mocking library: write an in-memory fake or stub of the port in its porttest package, as internal/engine/counting/port/porttest does"
            - pkg: github.com/maxbrunsfeld/counterfeiter
              desc: "no mocking library: write an in-memory fake or stub of the port in its porttest package, as internal/engine/counting/port/porttest does"
        # Properties are unit tests of a domain: rapid comes in only in a
        # domain package's own tests, not its code, its ports or porttest.
        rapid:
          list-mode: lax
          files:
            - "$all"
            - "!**/internal/slices/*/domain/*_test.go"
            - "!**/internal/slices/*/domain/**/*_test.go"
            - "!**/internal/engine/*/domain/*_test.go"
            - "!**/internal/engine/*/domain/**/*_test.go"
          deny:
            - pkg: "pgregory.net/rapid"
              desc: "rapid is used only by domain property tests; test anything else with ordinary tests and porttest's fakes"
    revive:
      rules:
        - name: file-length-limit
          arguments:
            - max: 600
              skipComments: true
              skipBlankLines: true
  exclusions:
    rules:
      - path: _test\.go$
        linters: [gosec]
      # Tests ask which OS they run on, exit (TestMain's os.Exit(m.Run()) and
      # a helper process are standard Go; the rule holds production code) and
      # may panic as a failure of their own. Taken from itos-template.
      - path: _test\.go$
        linters: [forbidigo]
        text: runtime\.GOOS|(os|syscall)\.Exit|panic
      # cmd's main exits with the code run returned (itos-template's decision 17).
      - path: ^cmd/go-template-itos/main\.go$
        linters: [forbidigo]
        text: os\.Exit
      # tools/ holds this repository's own programs, each a main writing to its
      # stdout and exiting with its code, outside the layers decision 11 draws.
      - path: ^tools/
        linters: [forbidigo]
        text: os\.Exit|fmt\.Print
formatters:
  enable:
    - gofmt
