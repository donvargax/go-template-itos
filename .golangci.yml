version: "2"
linters:
  default: standard
  enable:
    - depguard
    - gochecksumtype
    - gosec
    - revive
  settings:
    # Harvested from github.com/donvargax/itos-template/.golangci.yml with
    # owner MIT permission (CONTRIBUTORS.md). The ports' failures are sealed
    # sets (//sumtype:decl), and internal/cli gives each kind its exit code
    # in one switch per set (docs/CLI.md rule 32): a switch that leaves a
    # kind out is refused, and a default case does not count as naming them.
    # tools/bin/architecture-check proves it with compile-valid fixtures.
    gochecksumtype:
      default-signifies-exhaustive: false
    # Layer/production-I/O/mock rules harvested from
    # github.com/donvargax/itos-template/.golangci.yml with owner MIT
    # permission (CONTRIBUTORS.md), adapted to this module and layout.
    # tools/bin/architecture-check proves these with compile-valid fixtures.
    # The arrows are decision 6's: the domain and its ports reach the outside
    # only through adapters implementing the ports, and an adapter imports
    # nothing of ours but the ports.
    depguard:
      rules:
        # The domain and its ports, their tests too: nothing of ours but the
        # domain and its port subpackages (no adapter, slice, UI or cmd); the
        # kong rule below keeps kong out of it. Its tests run it against
        # porttest's fakes. domain-coverage reads this list: each glob's
        # folder is a domain package it measures (./internal/counting), its
        # port subpackages not measured, so the floor holds behaviour, not
        # the ports and fakes.
        domain:
          list-mode: lax
          files:
            - "**/internal/counting/**"
          allow:
            - github.com/itos-corp/go-template-itos/internal/counting$
            - github.com/itos-corp/go-template-itos/internal/counting/
          deny:
            - pkg: github.com/itos-corp/go-template-itos
              desc: "the domain imports no adapter, slice, UI or cmd (decision 6): reach the outside through internal/counting/port"
        # The domain's own code does no I/O: no os (os/exec with it) and no
        # net. Its tests may read a fixture.
        domain-io:
          files:
            - "**/internal/counting/**"
            - "!$test"
          deny:
            - pkg: os
              desc: "the domain does no I/O (decision 6): reach files and processes through internal/counting/port; tests may read fixtures"
            - pkg: net
              desc: "the domain does no I/O (decision 6): reach networks through internal/counting/port"
        # The count command is the slice's application handler: it carries
        # the command line's values to the domain through its ports and hands
        # the result to internal/cli. Its code and tests import no concrete
        # adapter; cmd wires disk and input into it.
        application:
          list-mode: lax
          files:
            - "**/internal/count/command/**"
          allow:
            - github.com/itos-corp/go-template-itos/internal/count/command$
            - github.com/itos-corp/go-template-itos/internal/counting$
            - github.com/itos-corp/go-template-itos/internal/counting/
            - github.com/itos-corp/go-template-itos/internal/cli$
          deny:
            - pkg: github.com/itos-corp/go-template-itos
              desc: "the count command imports the domain, its ports and internal/cli, never a concrete adapter; cmd wires those"
        # An adapter implements the ports and imports nothing of ours but
        # them: not the domain, another adapter, a slice, the UI or porttest's
        # fakes, which its tests alone may use. Each adapter is listed.
        infra:
          list-mode: lax
          files:
            - "**/internal/disk/**"
            - "**/internal/count/input/**"
            - "!$test"
          allow:
            - github.com/itos-corp/go-template-itos/internal/counting/port$
          deny:
            - pkg: github.com/itos-corp/go-template-itos
              desc: "an adapter imports nothing of ours but the ports it implements (decision 6)"
        mocks:
          files:
            - $all
          deny:
            - pkg: github.com/golang/mock
              desc: "use our own porttest fakes/stubs, never mocking libraries"
            - pkg: go.uber.org/mock
              desc: "use our own porttest fakes/stubs, never mocking libraries"
            - pkg: github.com/stretchr/testify/mock
              desc: "use our own porttest fakes/stubs, never mocking libraries"
            - pkg: github.com/vektra/mockery
              desc: "use our own porttest fakes/stubs, never mocking libraries"
            - pkg: github.com/maxbrunsfeld/counterfeiter
              desc: "use our own porttest fakes/stubs, never mocking libraries"
        # Properties are unit tests of the domain: rapid comes in only in the
        # domain package's own tests, not its code, its ports or porttest.
        rapid:
          files:
            - $all
            - "!**/internal/counting/*_test.go"
          deny:
            - pkg: pgregory.net/rapid
              desc: "rapid is used only by domain property tests"
        # kong is the UI's, harvested from itos-template's kong rule: here
        # the UI is the entry point and internal/cli. The count command
        # carries kong's struct tags, which need no import of kong.
        kong:
          files:
            - $all
            - "!**/cmd/**"
            - "!**/internal/cli/**"
          deny:
            - pkg: github.com/alecthomas/kong
              desc: "kong stays in the UI: cmd and internal/cli"
    revive:
      rules:
        - name: file-length-limit
          arguments:
            - max: 600
              skipComments: true
              skipBlankLines: true
  exclusions:
    rules:
      - path: _test\.go$
        linters: [gosec]
formatters:
  enable:
    - gofmt
