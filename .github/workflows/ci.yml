name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, "stack/**", "go/**"]
  push:
    branches: [main, "stack/**", "go/**"]

permissions:
  contents: read
  actions: read

# A newer push cancels a pull request's older run; a branch's pushes each keep theirs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job calls plain commands and sets the toolchain with the project's own go-toolchain
# action, and a draft pull request waits for ready_for_review.
jobs:
  static:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      # The whole history, which the credential scan walks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/go-toolchain
      - name: gofmt
        run: "! gofmt -l cmd internal features | grep ."
      - run: go build ./...
      - run: go vet ./...
      - run: go mod verify
      - run: go mod tidy -diff
      # THIRD_PARTY_NOTICES.md holds the notices of the modules the binary links and of Go: a new
      # dependency fails here until the file is written again.
      - run: go run ./tools/bin/notices -check
      - run: tools/bin/pinned golangci-lint run ./...
      - run: tools/bin/architecture-check
      - run: tools/bin/pre-commit-check
      - run: go run ./tools/bin/pre-push-check
      - run: go tool actionlint
      - run: tools/bin/govulncheck
      # The commits this run judges: from the pull request's base or the push's before, and the
      # whole history when before is all zeros, a branch's first push.
      - name: Credential scan of the pushed commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "${BASE//0/}" ]; then
            tools/bin/pinned gitleaks git --redact
          else
            tools/bin/pinned gitleaks git --redact --log-opts="$BASE..$HEAD"
          fi

  test:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # The scenarios run in process by default; the binary driver runs only where this is set
    # (decision 14): here, which every step of the job inherits, and in the nightly.
    env:
      GO_TEMPLATE_ITOS_FEATURES_BINARY_DRIVER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/go-toolchain
      - name: Tests
        run: go test ./cmd/... ./internal/...
        env:
          RAPID_CHECKS: 1
      # The release helpers' tests, harvested with them from itos-template: the version a range
      # bumps to, the module-path refusal, what moved beneath the binary and the notes it writes,
      # over example repositories. The platform jobs run them too, in go test ./....
      - run: go test ./tools/bin/release-version ./tools/bin/release-notes
      - run: tools/bin/domain-coverage
      # The features build the binary they run, which Go's test cache cannot track, so they
      # always run.
      - run: go test ./features -count=1
      # The live scenarios and which drivers run them, with no itos.
      - run: tools/bin/scenario-list
      # Mutation runs fresh on each push, over the commits this run judges: from the pull
      # request's base or the push's before, seeded by it. A branch's first push (before is
      # all zeros) runs the packages with no --since, seeded by the head. A surviving mutant or
      # a line no test reaches fails the step when there is a base; with none, only a surviving mutant
      # fails it. --all-tests, because cmd is reached only through the scenarios.
      - name: Mutation
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "${BASE//0/}" ]; then
            tools/bin/pinned itos-cc mutation run --count 10 --seed "$HEAD" --all-tests cmd internal
          else
            tools/bin/pinned itos-cc mutation run --count 10 --since "$BASE" --seed "$BASE" --all-tests --fail-uncovered=lines cmd internal
          fi

  # What a push judges on each platform (decision 15): Linux runs every test, the import rules'
  # fixtures included; macOS and Windows run the tests of cmd and internal and the scenarios, in
  # process (no binary driver), with each platform's paths,
  # shell and line endings, which is what breaks on Windows first. The rest of each platform's
  # tests wait for the nightly (nightly.yml), a day late and never lost. The repository is public,
  # so the minutes are free. They run on pull requests and on pushes to any branch but main: the
  # template lands by direct push to its branches, and a made project's main push follows a merged
  # pull request that ran them.
  platform:
    name: Tests (${{ matrix.os }})
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name == 'pull_request' || github.ref != 'refs/heads/main') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, packages: ./... }
          - { os: macos-latest, packages: ./cmd/... ./internal/... ./features }
          - { os: windows-latest, packages: ./cmd/... ./internal/... ./features }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-toolchain
      # The scenarios run in process by default (decision 14): the binary driver waits for the
      # nightly on macOS and Windows, and Linux's test job runs it (decision 15).
      # RAPID_CHECKS=1: each property of the domain on one random case.
      - name: Tests
        run: go test ${{ matrix.packages }} -count=1
        env:
          RAPID_CHECKS: 1
      - name: Import boundary self-test
        if: ${{ runner.os == 'Linux' }}
        run: tools/bin/architecture-check

  # A push to main whose static, test and platform jobs are green cuts a release when its commits
  # since the last tag carry a feat, a fix or a breaking change, or the binary is built from what
  # moved beneath it (release.yml says how). Harvested from itos-template's ci.yml, which calls
  # its release as itos's does. The only job with write access, granted here and to nothing else;
  # a pull request or a Renovate branch never releases. The template's branches are never main,
  # so it never runs in the template. The platform jobs skip a push to main, since the pull
  # request that landed it ran them, so a skipped result counts as green.
  release:
    needs: [static, test, platform]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.static.result == 'success' && needs.test.result == 'success' && (needs.platform.result == 'success' || needs.platform.result == 'skipped') }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
