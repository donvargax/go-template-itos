name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, "stack/**", "go/**"]
  push:
    branches: [main, "stack/**", "go/**"]

permissions:
  contents: read
  actions: read

# A newer push cancels a pull request's older run; a branch's pushes each keep theirs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # No Go here, so the root runs its two plain checks: the size caps of the always-read files
  # and the files every branch must keep. A draft pull request waits for ready_for_review.
  checks:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: tools/bin/doc-caps
      - run: >-
          test -f AGENTS.md && test -f CLAUDE.md && test -f CONTRIBUTORS.md &&
          test -f MAP.md && test -f PLAN.md && test -f README.md && test -f docs/ORCHESTRATING.md &&
          test -f docs/architecture/01-introduction-and-goals.md &&
          test -f docs/architecture/02-architecture-constraints.md &&
          test -f docs/architecture/09-architecture-decisions.md && test -f docs/security.md &&
          test -f docs/upgrading.md && test -f LICENSE && test -f .gitattributes &&
          test -f .gitignore && test -f .github/workflows/ci.yml &&
          test -f .github/renovate.json5 && test -x tools/bin/doc-caps
