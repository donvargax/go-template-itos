name: Release

# The release, cut by CI: ci.yml calls this after its ci and platform jobs pass
#
# Harvested from the owner's itos-template .github/workflows/release.yml, which
# took it from itos's, keeping the upstream identities of the actions it runs and
# retargeting the binary this repository builds. The attestation check, the
# publish retry and the request to the Go module proxy are itos's own steps
# (donvargax/itos's release.yml). No step runs itos: the version, the notes and
# the checks are plain Go programs and commands. ci.yml's
# release job calls it on a push to main, after the ci and platform jobs pass;
# the steps run tools/bin/release-version and tools/bin/release-notes, both
# harvested from itos-template too. The template's branches are never main, so
# it never runs in the template and nothing is published from it. On a made
# project's main it runs after the ci and platform jobs pass.
#
# It runs when ci.yml calls it on a push to main, and releases when the commits since the last
# vX.Y.Z tag carry a feat, a fix or a breaking change, or the binary is built from other modules
# or another Go toolchain than the last release was. The tag is the version, computed from those commits
# (tools/bin/release-version): a breaking change a major (a minor before 1.0), a feat a minor, a
# fix a patch, and a commit whose header is not a Conventional Commit a patch, named in the
# version step's output (decision 16); with none, a patch when the modules ./cmd/go-template-itos links or go.mod's toolchain moved,
# go list reading both commits, which is why Go is set up before the version step;
# else nothing is released and the job ends green. The notes of such a patch name what moved,
# read again by the same code (internal/release's BinaryMoved) from the module cache the
# version step filled. With no tag yet the last version is 0.0.0, so the first release is v0.1.0.
# Its one gate of its own is that version against go.mod's module path: a major the
# path does not end in (/vN from v2, nothing below) fails the version step, before any tag, since
# Go's module proxy would refuse that tag. Otherwise the push's CI is what a release rests on, and
# a break that slips through is a missing check, fixed forward with the check and a fix release.
#
# What it publishes (.goreleaser.yaml): the five archives, Linux and macOS on amd64 and arm64 and
# Windows on amd64, each binary stamped with the version, and checksums.txt. In order, all in this
# one job, since a tag pushed with the workflow's token starts no other workflow:
#   1. the version; nothing more when there is none;
#   2. the tag, made locally only;
#   3. GoReleaser (tools/bin/pinned, at the version pinned there) builds, packs and uploads a draft
#      release whose target is this commit. A step before it logs in to ghcr.io as the workflow's
#      actor with its token, which ko needs to push the image and the attestation steps need to
#      write and read it. It runs with the image on or off, since nothing before GoReleaser can
#      know, and a login pushes nothing;
#   4. the archives are attested (Sigstore, no keys; `gh attestation verify <file> -R
#      itos-corp/go-template-itos` checks one). Attesting needs a public repository, as this one is,
#      or GitHub Enterprise Cloud: a private repository on GitHub Free or Team cannot attest, and
#      this step would fail there;
#   5. the attestation is verified on the built linux amd64 archive, before anything is published:
#      a release whose attestation cannot be read fails here.
#      With .goreleaser.yaml's kos section on, GoReleaser also pushes the container image
#      (ghcr.io/itos-corp/go-template-itos:<version>, linux amd64 and arm64, off by default,
#      decision 17); the image's digest, read from dist/goreleaser/artifacts.json, is attested and
#      verified the same way, by `gh attestation verify oci://<image>@<digest>`, before Publish.
#      With the section off both steps say so and pass;
#   6. the notes are generated (tools/bin/release-notes: why the version is what it is, what
#      moved beneath the binary for a patch with no feat, fix or breaking change, git-cliff over
#      the range, every BREAKING-CHANGE and Upgrading footer quoted), from the last release's tag
#      the version step printed;
#   7. the draft is published with those notes, which is when GitHub creates the tag, so the tag
#      and a release holding every asset appear together. A run that fails before leaves no tag,
#      only a draft the next run replaces; a tag is never moved;
#   8. proxy.golang.org is asked for the version, so go install @latest finds it at once; no
#      answer is a warning, never a failure, the release being published by then.
# The releaser never commits: the notes are the release's description, not a file.
on:
  workflow_call:

jobs:
  release:
    runs-on: ubuntu-latest
    # The only job given write access: the release and its assets, the OIDC token Sigstore signs
    # with, and the attestations.
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
    # One at a time, never cancelled, so pushes in a row cut their releases in order. ci.yml's
    # runs on main already wait for each other; this holds even if that changes.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      # Every action pinned to a commit, as ci.yml pins them, with the upstream
      # identities kept.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags and the commits since the last one
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Version
        id: version
        run: |
          go run ./tools/bin/release-version > "$RUNNER_TEMP/version.txt"
          cat "$RUNNER_TEMP/version.txt" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/version.txt"
      # The GitHub CLI, to publish the draft: pinned from its release tarball and checked against
      # its SHA-256, as itos installs it, so the runner's own copy does not decide what runs.
      - name: GitHub CLI
        if: steps.version.outputs.next != ''
        env:
          GH_VERSION: 2.101.0
          GH_SHA256: 9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          tgz="$RUNNER_TEMP/gh.tar.gz"
          curl -sSfL -o "$tgz" "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
          echo "$GH_SHA256  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP" "gh_${GH_VERSION}_linux_amd64/bin/gh"
          mv "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64/bin/gh" "$RUNNER_TEMP/bin/gh"
          rm -rf "$tgz" "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gh" --version
      # Local only: GoReleaser reads the version from it, and GitHub creates the remote tag when the
      # draft is published.
      - name: Tag
        if: steps.version.outputs.next != ''
        env:
          TAG: v${{ steps.version.outputs.next }}
        run: git tag "$TAG" "$GITHUB_SHA"
      - name: Log in to the image registry
        if: steps.version.outputs.next != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: GoReleaser
        if: steps.version.outputs.next != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tools/bin/pinned goreleaser release --clean
      # checksums.txt lists every archive by name and SHA-256: each is a subject.
      - name: Attest
        if: steps.version.outputs.next != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/goreleaser/checksums.txt
      # The attestation is verified here, where the bytes it signs are, on the linux amd64 archive
      # just built and not on a copy fetched from GitHub; gh attestation verify takes the file,
      # never a digest. Retried a few times, as the attestation takes a moment to be readable
      # after the action writes it. It fails the job before Publish.
      - name: Verify the attestation
        if: steps.version.outputs.next != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          archive="dist/goreleaser/go-template-itos-$NEXT-linux-amd64.tar.gz"
          for attempt in 1 2 3 4 5 6; do
            if gh attestation verify "$archive" -R "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            echo "attempt $attempt: the attestation is not readable yet"
            sleep 10
          done
          exit 1
      # The image, when .goreleaser.yaml's kos section is on, is in artifacts.json: its name, with
      # the tag, and its digest, which ko pushed as the digest of the multi-platform index. The
      # attestation signs that digest, so a pull by digest is what the check proves. With the
      # section off nothing is listed, and this step and the two after it say so and pass.
      - name: Find the image
        id: image
        if: steps.version.outputs.next != ''
        run: |
          name=$(jq -r '[.[] | select(.type == "Docker Manifest")][0].name // empty' dist/goreleaser/artifacts.json)
          digest=$(jq -r '[.[] | select(.type == "Docker Manifest")][0].extra.Digest // empty' dist/goreleaser/artifacts.json)
          if [ -z "$name" ] || [ -z "$digest" ]; then
            echo "No image is published: the kos section of .goreleaser.yaml is off."
            exit 0
          fi
          echo "name=$(printf '%s' "$name" | sed -E 's/(@.*|:[^:/]+)$//')" >> "$GITHUB_OUTPUT"
          echo "digest=sha256:${digest#sha256:}" >> "$GITHUB_OUTPUT"
          echo "Published image: $name, digest sha256:${digest#sha256:}"
      - name: Attest the image
        if: steps.image.outputs.digest != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      # Verified by digest from the registry, as a consumer pulls it, and retried as the archive's is.
      - name: Verify the image attestation
        if: steps.version.outputs.next != ''
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          if [ -z "$DIGEST" ]; then
            echo "No image is published: nothing to verify."
            exit 0
          fi
          for attempt in 1 2 3 4 5 6; do
            if gh attestation verify "oci://$IMAGE@$DIGEST" -R "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            echo "attempt $attempt: the image attestation is not readable yet"
            sleep 10
          done
          exit 1
      - name: Notes
        if: steps.version.outputs.next != ''
        env:
          LAST: ${{ steps.version.outputs.last }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          go run ./tools/bin/release-notes -version "$NEXT" -from "$LAST" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish
        if: steps.version.outputs.next != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ steps.version.outputs.next }}
        # Retried a few times, as the attestation check is: GitHub answers it with a 5xx now and
        # then, even after it has made the tag.
        run: |
          for attempt in 1 2 3 4 5 6; do
            if gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --draft=false --latest; then
              exit 0
            fi
            echo "attempt $attempt: the release is not published yet"
            sleep 10
          done
          echo "::error::$TAG is still a draft: publish it by hand with gh release edit $TAG --draft=false"
          exit 1
      # proxy.golang.org caches a module's version list and @latest and refreshes them on its own
      # schedule, so go install ...@latest lags each new release for a while. Asking the proxy for
      # the new version makes it fetch the tag at once; @latest follows later. The module path is
      # go.mod's, so the next major needs no edit here (it is all lower case, which the proxy's
      # path takes as is). The release is published by now, so a proxy that never answers is a
      # warning and never fails the job.
      - name: Ask the Go module proxy for the version
        if: steps.version.outputs.next != ''
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          module=$(go list -m)
          url="https://proxy.golang.org/$module/@v/v$NEXT.info"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 60 "$url"; then
              echo
              exit 0
            fi
            echo "attempt $attempt: the proxy has no $module@v$NEXT yet"
            sleep 10
          done
          echo "::warning::proxy.golang.org did not answer for $module@v$NEXT; go install fetches it on first use, and @latest may lag"
          exit 0
