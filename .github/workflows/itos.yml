name: Itos

# The template's own itos checks: the commit shape, footers and ledger (itos verify) and the
# plan in itos.yaml (itos ci run) over the push's range. A made project needs no itos
# (decision 10), so the manifest's template_only list keeps this file out of renders; ci.yml
# is the workflow a made project keeps, and it calls plain commands.

on:
  pull_request:
    branches: [main, "stack/**", "go/**"]
  push:
    branches: [main, "stack/**", "go/**"]

permissions:
  contents: read
  actions: read

concurrency:
  group: itos-${{ github.ref }}
  cancel-in-progress: false

env:
  TO: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  itos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: donvargax/itos@da2f0eaf40f6fd5584ee2193d866580d4d78263c # v8.3.0
      - name: Range
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          out=$(itos ci range --json --head "$TO" --base "$BASE")
          from=$(jq -er '.from | strings' <<<"$out")
          echo "FROM=$from"
          echo "FROM=$from" >> "$GITHUB_ENV"
      - run: itos verify "$FROM" "$TO"
      - run: itos ci run "$FROM" "$TO"
