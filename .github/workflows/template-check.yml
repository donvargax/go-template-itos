name: Template check

# Renders every combination the manifest allows and runs its checks in each, so a change to the
# manifest or to a branch a render carries cannot break a render while every branch's own CI stays
# green. check renders the branch heads (the pushed one, origin's for the rest), so a push to any
# of them re-proves every combination; the weekly run catches what moves beneath unchanged code.
# The file is root-owned and merges down; the manifest lists it in template_only.
on:
  push:
    branches: [main, "stack/**", "go/**"]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Every branch, so check finds origin's heads beside the one checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: template
          fetch-depth: 0
          persist-credentials: false
      # go/cli's go.mod names the toolchain the renders build with; reading it from that branch
      # keeps this job's Go moving with the code rather than with a number copied here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: go/cli
          path: go-cli
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-cli/go.mod
          cache-dependency-path: go-cli/go.sum
      # go install verifies the module against Go's checksum database.
      - run: go install github.com/donvargax/itos-template/cmd/itos-template@v0.19.0
      # The output goes to a file and check's own exit status is kept, so nothing reading it can
      # hide a failure. A warning (a render left unscanned for credentials) or anything short of
      # every combination passing fails the job as a non-zero exit does.
      - name: Check every combination
        working-directory: template
        run: |
          out="$RUNNER_TEMP/check.txt"
          status=0
          itos-template check --answer name=blue-fox --answer owner=acme \
            --answer module=example.com/blue/fox > "$out" 2>&1 || status=$?
          cat "$out"
          if [ "$status" -ne 0 ]; then
            echo "::error::itos-template check exited $status"
            exit 1
          fi
          if grep -qi warning "$out"; then
            echo "::error::itos-template check printed a warning"
            exit 1
          fi
          if ! grep -qE '^([1-9][0-9]*) of \1 combinations passed\.$' "$out"; then
            echo "::error::itos-template check did not report every combination passing"
            exit 1
          fi

  # Deprecated in favour of per-branch-ledgers (q-10): once each branch has its own ledger file and
  # no render merge conflicts, remove this job and its actions write.
  #
  # Every branch appends to one ledger file, so a parent's new entry conflicts with its children's
  # until the merge down reaches go/cli, and the Template check run of that parent's head stays red
  # with nothing to run it again. After check passes, this job re-runs the failed jobs of the latest
  # run on main's and stack/go's current heads. A run that is this one, still in progress or passed
  # is left alone; go/cli has no children, so it is never re-run here.
  #
  # It cannot loop or storm. A rerun is no push and no schedule, so it starts no new run. --failed
  # re-runs only the failed jobs and what depends on them, and only a passing check reaches this
  # job, so each failed head run is re-run at most once per passing run. When a re-run attempt
  # passes, its own job skips its run as the current one and finds the other head's run passed or
  # already in progress from the run that re-ran both, so it has nothing left to re-run; a red
  # attempt never reaches this job.
  rerun-parents:
    needs: check
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that may re-run runs; check keeps the workflow's read-only contents.
    permissions:
      actions: write
      contents: read
    steps:
      - name: Re-run the parents' failed runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          for branch in main stack/go; do
            sha=$(gh api "repos/$GH_REPO/branches/$branch" --jq .commit.sha)
            latest=$(gh run list --workflow template-check.yml --branch "$branch" --commit "$sha" \
              --limit 1 --json databaseId,status,conclusion \
              --jq '.[] | "\(.databaseId) \(.status) \(.conclusion)"')
            if [ -z "$latest" ]; then
              echo "$branch $sha has no Template check run"
              continue
            fi
            read -r id state conclusion <<< "$latest"
            if [ "$id" = "$CURRENT_RUN" ]; then
              echo "$branch $sha: run $id is this run"
            elif [ "$state" != completed ]; then
              echo "$branch $sha: run $id is $state"
            elif [ "$conclusion" != failure ]; then
              echo "$branch $sha: run $id ended $conclusion"
            else
              echo "$branch $sha: re-running the failed jobs of run $id"
              gh run rerun "$id" --failed
            fi
          done
